<html lang="ko">
<head>

<style>
:root{
  --navy-950:#03122A; --navy-900:#06224A; --navy:#003A80; --navy-700:#0B4FA3;

  --text:#DCE8F5; --text-dim:#8FA7C4; --lime:#A4C81C; --lime-bright:#BFE33A;
  --amber:#F2A65A; --red:#FF5D5D; --cyan:#3FC7C0;
  --font:Inter,"Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--navy-950);color:var(--text);font-family:var(--font);font-size:14px;overflow:hidden;touch-action:none}
#cesium{position:fixed;inset:0}
#cesium .cesium-viewer-bottom,#cesium .cesium-widget-credits{display:none!important}
#credit{display:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* 상단 좌측: 로고 + 상태 배지 */
#top{position:fixed;left:14px;top:12px;display:flex;align-items:center;gap:12px;z-index:5;pointer-events:none}
.brand{display:flex;align-items:baseline;gap:8px;user-select:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.brand .word{font-weight:800;font-size:19px;letter-spacing:.06em;color:#fff}
.brand .word b{color:var(--lime);font-weight:900}
.brand .sub{font-weight:300;font-size:13px;letter-spacing:.32em;color:var(--text-dim)}
#badge{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:rgba(3,18,42,.72);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;backdrop-filter:blur(4px);transition:background .3s}
#badge.warn{border-color:rgba(242,166,90,.6);color:var(--amber)}
#badge.rec{border-color:rgba(255,93,93,.5)}
#badge.ok{border-color:rgba(164,200,28,.6);color:var(--lime-bright)}
#speed{position:fixed;right:14px;top:12px;z-index:5;pointer-events:none;text-align:right;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#speed b{font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em}
#speed span{font-size:12px;color:var(--text-dim);margin-left:3px}
/* 탭 시 제어막대 */
#bar{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(8px);display:flex;gap:8px;padding:8px;border-radius:16px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:6;max-width:calc(100vw - 20px);flex-wrap:wrap;justify-content:center}
#bar.show{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#bar button{min-width:56px;min-height:56px;padding:0 16px;border-radius:12px;background:rgba(255,255,255,.06);font-size:15px;font-weight:600;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.1}
#bar button small{font-size:11px;color:var(--text-dim);font-weight:500}
#bar button.on{background:var(--navy);box-shadow:inset 0 0 0 1px var(--line-strong);color:#fff}
#bar button.on small{color:var(--lime-bright)}
#bar button:active{background:rgba(255,255,255,.14)}
/* 출처(연한 표기) */
#attr{position:fixed;right:10px;bottom:6px;font-size:10px;color:rgba(220,232,245,.42);z-index:4;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap}
/* 디버그 */
#dbg{position:fixed;left:14px;bottom:10px;z-index:5;font:11px/1.45 ui-monospace,Consolas,monospace;color:#cfe;background:rgba(3,18,42,.72);padding:8px 10px;border-radius:8px;border:1px solid var(--line);white-space:pre;display:none;pointer-events:none}
#dbg.show{display:block}
/* 내보내기 모달 */
#modal{position:fixed;inset:0;background:rgba(3,18,42,.65);display:none;align-items:center;justify-content:center;z-index:9}
#modal.show{display:flex}
#modal .box{width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--navy-900);border:1px solid var(--line-strong);border-radius:16px;padding:16px}
#modal h2{margin:0 0 10px;font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center}
#modal h2 button{min-width:56px;min-height:56px;font-size:20px;color:var(--text-dim)}
.trip{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.trip .info{flex:1;min-width:0}
.trip .info b{display:block;font-size:14px}
.trip .info span{font-size:12px;color:var(--text-dim)}
.trip button{min-width:56px;min-height:56px;padding:0 10px;border-radius:10px;background:rgba(255,255,255,.07);font-size:13px;font-weight:600}
.trip button.del{color:var(--red)}
#toast{position:fixed;left:50%;top:60px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;opacity:0;transition:opacity .3s;z-index:8;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.empty{padding:24px 0;text-align:center;color:var(--text-dim)}
</style>

/* ---------- 지도정합: Overpass 도로 로드 ---------- */
const ROADS = { ways:new Map(), nodeWays:new Map(), bbox:null, fetching:false, lastFetch:0, origin:null, kx:1, ky:1, fails:0 };
const HW = ['motorway','trunk','primary','secondary','tertiary','unclassified','residential','motorway_link','trunk_link','primary_link','secondary_link','tertiary_link','living_street','service','road'];
const DEFW = { motorway:22, trunk:20, primary:18, secondary:14, tertiary:10, unclassified:7, residential:6, living_street:5, service:4, motorway_link:7, trunk_link:7, primary_link:7, secondary_link:7, tertiary_link:6, road:6 };
function setOrigin(lon,lat){ ROADS.origin=[lon,lat]; ROADS.kx=Math.cos(rad(lat))*R*Math.PI/180; ROADS.ky=R*Math.PI/180; }
const L = p => [(p[0]-ROADS.origin[0])*ROADS.kx, (p[1]-ROADS.origin[1])*ROADS.ky];
const UL = m => [ROADS.origin[0]+m[0]/ROADS.kx, ROADS.origin[1]+m[1]/ROADS.ky];
async function fetchRoads(lon,lat){

  const r=CONFIG.match.fetchR, dlat=deg(r/R), dlon=deg(r/(R*Math.cos(rad(lat))));
  const bb=[lat-dlat, lon-dlon, lat+dlat, lon+dlon];
  const ql=`[out:json][timeout:20];way["highway"~"^(${HW.join('|')})$"](${bb.map(v=>v.toFixed(5)).join(',')});out tags geom;`;
  if(!ROADS.origin) setOrigin(lon,lat);
  let j=null;

  ROADS.fails=0;
  for(const e of j.elements){ if(e.type!=='way'||!e.geometry||ROADS.ways.has(e.id)) continue; const tg=e.tags||{};
    let w=parseFloat(tg.width); const lanes=parseFloat(tg.lanes); if(!(w>0)) w = lanes>0? lanes*3.25 : (DEFW[tg.highway]||6);
    const one = ['yes','1','true'].includes(tg.oneway) || tg.highway==='motorway' || tg.junction==='roundabout';
    const g = e.geometry.map(p=>L([p.lon,p.lat]));
    if(tg.oneway==='-1'){ g.reverse(); e.nodes && e.nodes.reverse(); }
    const way={ id:e.id, hw:tg.highway, name:tg.name||tg.ref||'', w, one: one || tg.oneway==='-1', layer: parseInt(tg.layer||'0')||0, bridge: tg.bridge==='yes', tunnel: tg.tunnel==='yes', g, nodes:e.nodes||[], segs:[] };
    for(let k=1;k<g.length;k++){ const a=g[k-1],b=g[k]; const dx=b[0]-a[0],dy=b[1]-a[1]; const len=Math.hypot(dx,dy)||1e-9; way.segs.push({ a,b,dx,dy,len, br:(deg(Math.atan2(dx,dy))+360)%360 }); }

  }

  ROADS.areas = ROADS.areas||[]; ROADS.areas.push({ c:L([lon,lat]), r });
  if(ROADS.ways.size>6000){ // 메모리 보호: 멀리 떨어진 도로 삭제
    const here=L([lon,lat]); for(const [id,w] of ROADS.ways){ if(Math.hypot(w.g[0][0]-here[0], w.g[0][1]-here[1])>6000) ROADS.ways.delete(id); } }
}
function coveredMargin(lon,lat){ if(!ROADS.areas||!ROADS.areas.length) return -1; const p=L([lon,lat]); let best=-1e9; for(const a of ROADS.areas){ const m=a.r-Math.max(Math.abs(p[0]-a.c[0]),Math.abs(p[1]-a.c[1])); if(m>best) best=m; } return best; }
function connected(wa,wb){ if(!wa||!wb) return false; for(const n of wa.nodes) if(ROADS.nodeWays.has(n) && ROADS.nodeWays.get(n).has(wb.id)) return true; return false; }
// 한 픽스를 도로에 정합 → { way, segI, pt(m), d, hd(도로 진행방향 deg) } 또는 null
function matchFix(lon,lat,hdg,acc,spdKmh){

/* ---------- 위치 픽스 처리 ---------- */
function onFix(f){ // f: {ts, lon, lat, spd(m/s|null), hdg(deg|null), acc(m)}
  const now=performance.now();
  if(S.lastFix) S.fixGap = now-S.lastFix; S.lastFix=now; S.fixes++; S.weak=false; S.acc=f.acc||0;
  if(S.lon==null){ S.lon=f.lon; S.lat=f.lat; S.dr={lon:f.lon,lat:f.lat}; S.hdg=f.hdg||0; setOrigin(f.lon,f.lat); fetchRoads(f.lon,f.lat); }
  // 속도: GPS 속도 없으면 이전 위치로 계산
  let spd = f.spd; if(spd==null||isNaN(spd)){ if(S.prevRaw && S.fixGap>0) spd = hav(S.prevRaw,[f.lon,f.lat])/(S.fixGap/1000); else spd=0; }
  S.prevRaw=[f.lon,f.lat]; S.spd = spd; const kmh=spd*3.6;

  if(kmh>CONFIG.headingMinSpeed && f.hdg!=null && !isNaN(f.hdg)) S.hdg = (S.hdg + angDiff(S.hdg, f.hdg)*CONFIG.headingLP + 360)%360;
  // 도로 로드 (처음 또는 가장자리 500 m 이내)
  if(coveredMargin(f.lon,f.lat) < CONFIG.match.refetchMargin) fetchRoads(f.lon,f.lat);
  // 지도정합
  const m = matchFix(f.lon,f.lat,S.hdg,f.acc,kmh); S.rawLL=[f.lon,f.lat];
  let tgt=[f.lon,f.lat];
  if(m){
    if(S.way && m.way.id!==S.way.id){ // 도로 전환은 2~3회 연속 일치 후
      if(S.wayCand===m.way.id) S.candN++; else { S.wayCand=m.way.id; S.candN=1; }
      if(S.candN<CONFIG.match.switchFixes){ // 기존 도로에 투영 유지
        const keep = matchOnWay(S.way, f.lon,f.lat, S.hdg, kmh); if(keep && keep.d<Math.max(CONFIG.match.minR,f.acc||0)*1.5) applyMatch(keep, f); else applyMatch(m,f);

    } else applyMatch(m,f);

}
function matchOnWay(w, lon,lat,hdg,kmh){ const p=L([lon,lat]); let best=null; for(let i=0;i<w.segs.length;i++){ const s=w.segs[i]; let u=((p[0]-s.a[0])*s.dx+(p[1]-s.a[1])*s.dy)/(s.len*s.len); u=clamp(u,0,1); const px=s.a[0]+s.dx*u, py=s.a[1]+s.dy*u; const d=Math.hypot(px-p[0],py-p[1]); let hd=s.br, rev=false; if(!w.one && Math.abs(angDiff(hdg,(s.br+180)%360))<Math.abs(angDiff(hdg,s.br))){ hd=(s.br+180)%360; rev=true; } if(!best||d<best.d) best={ way:w, segI:i, u, pt:[px,py], d, hd, rev, sc:d }; } return best; }
function applyMatch(m,f){ S.way=m.way; S.wayCand=null; S.candN=0; S.match=m; S.matched=true; S.matchDist=m.d; S.laneOff=laneOffsetFor(m.way);

  const off=[Math.cos(rad(m.hd))*S.laneOff, -Math.sin(rad(m.hd))*S.laneOff]; // 동=x 북=y → 우측 벡터 (sin(h+90), cos(h+90)) = (cos h, -sin h)
  S.matchedLL = UL([m.pt[0]+off[0], m.pt[1]+off[1]]); S.matchedCenter=m.pt; }

/* ---------- 프레임 업데이트: 추측항법 + 수렴 + 카메라 ---------- */
let lastT=performance.now(), fpsAcc=0, fpsN=0, fps=60, lowSince=0;
function frame(){ const now=performance.now(); const dt=Math.min(0.1,(now-lastT)/1000); lastT=now;
  fpsAcc+=dt; fpsN++; if(fpsAcc>=1){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; autoQuality(); }
  if(S.lon==null) return;
  const since=(now-S.lastFix)/1000;
  if(since>CONFIG.gpsWeakSec && !S.weak){ S.weak=true; }
  // 추측항법: 신호 끊긴 뒤 3 s 까지만 전진
  if(S.started && since<=CONFIG.gpsWeakSec && S.spd>0.3){
    const d=S.spd*dt;
    if(S.matched && S.match){ const adv=advanceAlong(S.match, d); S.match=adv; S.way=adv.way; const off=[Math.cos(rad(adv.hd))*S.laneOff, -Math.sin(rad(adv.hd))*S.laneOff]; const ll=UL([adv.pt[0]+off[0], adv.pt[1]+off[1]]); S.dr={lon:ll[0],lat:ll[1]}; if(S.spd*3.6>CONFIG.headingMinSpeed) S.hdg=(S.hdg+angDiff(S.hdg,adv.hd)*Math.min(1,dt*3)+360)%360; }

  const kmh=S.spd*3.6; const V=CONFIG.view; let tr=V[V.length-1][1], tp=V[V.length-1][2]; for(let i=1;i<V.length;i++){ if(kmh<=V[i][0]){ const f=(kmh-V[i-1][0])/(V[i][0]-V[i-1][0]||1); tr=V[i-1][1]+(V[i][1]-V[i-1][1])*f; tp=V[i-1][2]+(V[i][2]-V[i-1][2])*f; break; } }

  const ke=Math.min(1, dt/CONFIG.viewEase*2.2); S.viewRange+= (tr-S.viewRange)*ke; S.viewPitch+=(tp-S.viewPitch)*ke;

// 차량이 (anchorX·W, anchorY·H) 에 오도록: lookAt 후 피치 상향 α = atan( tan(fovy/2) · (2·anchorY−1) )
function placeCamera(){

viewer.clock.onTick.addEventListener(frame);

/* ---------- 3D Tiles (SISTECH 드론 모델) 거리 기반 로드/해제 ---------- */
const TILES = { active:[], lastT:0, loading:new Set(),
  tick(now){ if(now-this.lastT<2000 || S.lon==null) return; this.lastT=now;
    const here=[S.lon,S.lat]; const ds=PROJECTS.map(p=>({p, d:hav(here,[p.lon,p.lat])})).sort((a,b)=>a.d-b.d);
    for(const {p,d} of ds){ if(p.ts && d>CONFIG.tiles.unloadKm*1000){ scene.primitives.remove(p.ts); p.ts=null; this.active=this.active.filter(x=>x!==p); } }

/* ---------- 주행 기록 (IndexedDB 'sistech-tesla') ---------- */
const LOG = { db:null, mem:{ trips:new Map(), fixes:[], upload:[] }, trip:null, buf:[], aboveSince:0, idleSince:0, flashTxt:'', flashUntil:0, pendingUp:0, lastLL:null, lastT:0, dbErr:null,
  open(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open('sistech-tesla',1); }catch(e){ return rej(e); } r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains('trips')) d.createObjectStore('trips',{keyPath:'id'}); if(!d.objectStoreNames.contains('fixes')){ const s=d.createObjectStore('fixes',{autoIncrement:true}); s.createIndex('trip','tripId'); } if(!d.objectStoreNames.contains('upload')) d.createObjectStore('upload',{autoIncrement:true}); }; r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); r.onblocked=()=>rej(new Error('blocked')); }); },
  tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error); }); },
  // 저장 계층: IndexedDB 우선, 실패 시(iframe·시크릿 등) 메모리 폴백 (세션 내 내보내기는 가능)
  async putTrip(t){ this.mem.trips.set(t.id, Object.assign({}, t)); if(this.db) await this.tx('trips','readwrite',s=>s.put(t)); },
  async addFixes(batch){ if(this.db) await this.tx('fixes','readwrite',s=>{ for(const r of batch) s.add(r); }); else this.mem.fixes.push(...batch); },
  async trips(){ if(this.db) return this.tx('trips','readonly',s=>s.getAll()); return [...this.mem.trips.values()]; },
  async fixes(id){ if(this.db) return this.tx('fixes','readonly',s=>s.index('trip').getAll(id)); return this.mem.fixes.filter(f=>f.tripId===id); },
  async del(id){ if(this.db){ const keys = await this.tx('fixes','readonly',s=>s.index('trip').getAllKeys(id)); await this.tx('fixes','readwrite',s=>{ for(const k of keys) s.delete(k); }); await this.tx('trips','readwrite',s=>s.delete(id)); } this.mem.trips.delete(id); this.mem.fixes=this.mem.fixes.filter(f=>f.tripId!==id); },
  onFix(f,kmh){ if(REPLAY) return; const now=Date.now();
    if(!this.trip){ if(kmh>CONFIG.log.startKmh){ if(!this.aboveSince) this.aboveSince=now; else if(now-this.aboveSince>=CONFIG.log.startSec*1000) this.start(now); } else this.aboveSince=0; }
    if(!this.trip) return;
    const rec={ tripId:this.trip.id, ts:f.ts||now, lat:f.lat, lon:f.lon, speed:+(kmh).toFixed(1), heading:+S.hdg.toFixed(1), accuracy:f.acc!=null?+f.acc.toFixed(1):null, matchedLat:S.matchedLL?+S.matchedLL[1].toFixed(7):null, matchedLon:S.matchedLL?+S.matchedLL[0].toFixed(7):null, wayId:S.way?S.way.id:null, matched:S.matched };
    this.buf.push(rec); this.trip.n++; if(this.lastLL) this.trip.dist+=hav(this.lastLL,[f.lon,f.lat]); this.lastLL=[f.lon,f.lat];
    if(kmh<1){ if(!this.idleSince) this.idleSince=now; else if(now-this.idleSince>CONFIG.log.endIdleMin*60000) this.end(); } else this.idleSince=0;
    if(now-this.lastT>CONFIG.log.flushMs) this.flush(); },
  start(now){ this.trip={ id:'T'+new Date(now).toISOString().replace(/[-:T]/g,'').slice(0,14), start:now, end:null, n:0, dist:0, src: SIM?'sim':'gps' }; this.lastLL=null; this.lastT=now; this.putTrip(this.trip).catch(()=>{}); toast(this.db? '주행 기록 시작' : '주행 기록 시작 (저장소 사용 불가: 세션 메모리에만 보관)', 3000); },
  async flush(final){ this.lastT=Date.now(); if(!this.buf.length && !final) return;
    const batch=this.buf; this.buf=[]; this.flashTxt='⏳ 저장 중…'; this.flashCls='warn'; this.flashUntil=performance.now()+1500;
    const t0=performance.now();
    try{ await this.addFixes(batch); if(this.trip) await this.putTrip(this.trip); const wait=Math.max(0, 700-(performance.now()-t0)); if(wait) await new Promise(r=>setTimeout(r,wait)); /* '저장 중' 최소 0.7 s 표시 */ this.flashTxt='✓ 저장됨 '+hhmm(Date.now()); this.flashCls='ok'; this.flashUntil=performance.now()+2500; }
    catch(e){ this.buf=batch.concat(this.buf); this.flashTxt='저장 실패'; this.flashCls='warn'; this.flashUntil=performance.now()+2500; }
    this.upload(batch); },
  end(){ if(!this.trip) return; this.trip.end=Date.now(); const t=this.trip; this.flush(true).then(()=>this.putTrip(t)).catch(()=>{}); this.trip=null; this.aboveSince=0; this.idleSince=0; this.lastLL=null; toast('주행 기록 종료'); },
  // 클라우드 업로드 훅 (기본 OFF: localStorage 'tesla.uploadUrl' 설정 시에만 JSON POST)
  async upload(batch){ let url=null; try{ url=localStorage.getItem('tesla.uploadUrl'); }catch(e){} if(!url) return;
    try{
      if(batch && batch.length){ const item={ tripId:this.trip&&this.trip.id, fixes:batch }; if(this.db) await this.tx('upload','readwrite',s=>s.add(item)); else this.mem.upload.push({k:Date.now()+Math.random(), v:item}); }
      let items; if(this.db) items = await this.tx('upload','readonly',s=>{ const o={}; const r=s.openCursor(); const arr=[]; r.onsuccess=()=>{ const c=r.result; if(c){ arr.push({k:c.key,v:c.value}); c.continue(); } else o.result=arr; }; return o; }); else items=this.mem.upload.slice();
      this.pendingUp = items.length; if(!navigator.onLine) return;
      for(const it of items){ const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(it.v)}); if(!r.ok) break; if(this.db) await this.tx('upload','readwrite',s=>s.delete(it.k)); else this.mem.upload=this.mem.upload.filter(x=>x.k!==it.k); this.pendingUp--; }
    }catch(e){ console.warn('upload', e.message); } },
};
LOG.open().catch(e=>{ LOG.dbErr=String(e&&e.message||e); console.warn('idb', LOG.dbErr); });

function dl(name, text, type){ const blob=new Blob([text],{type}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },2000); }
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
async function exportTrip(t, fmt){ const fx=(await LOG.fixes(t.id)).sort((a,b)=>a.ts-b.ts); if(!fx.length) return toast('기록 없음');
  if(fmt==='gpx'){ const pts=fx.map(f=>`   <trkpt lat="${f.lat.toFixed(7)}" lon="${f.lon.toFixed(7)}"><time>${new Date(f.ts).toISOString()}</time><extensions><speed>${(f.speed/3.6).toFixed(2)}</speed><course>${f.heading}</course>${f.accuracy!=null?`<hdop>${f.accuracy}</hdop>`:''}${f.matchedLat!=null?`<sistech:matchedLat>${f.matchedLat}</sistech:matchedLat><sistech:matchedLon>${f.matchedLon}</sistech:matchedLon><sistech:wayId>${f.wayId}</sistech:wayId>`:''}</extensions></trkpt>`).join('\n');

  else if(fmt==='geojson'){ const gj={ type:'FeatureCollection', properties:{ id:t.id, start:new Date(t.start).toISOString(), end:t.end?new Date(t.end).toISOString():null, distance_m:Math.round(t.dist), n:fx.length, src:t.src },
      features:[ { type:'Feature', properties:{ kind:'raw' }, geometry:{ type:'LineString', coordinates: fx.map(f=>[f.lon,f.lat]) } }, { type:'Feature', properties:{ kind:'matched' }, geometry:{ type:'LineString', coordinates: fx.filter(f=>f.matchedLat!=null).map(f=>[f.matchedLon,f.matchedLat]) } },
        ...fx.map(f=>({ type:'Feature', properties:{ ts:new Date(f.ts).toISOString(), speed_kmh:f.speed, heading:f.heading, accuracy:f.accuracy, wayId:f.wayId, matched:f.matched, matchedLat:f.matchedLat, matchedLon:f.matchedLon }, geometry:{ type:'Point', coordinates:[f.lon,f.lat] } })) ] };
    dl(`${t.id}.geojson`, JSON.stringify(gj), 'application/geo+json'); }
  else { const rows=[['ts','lat','lon','speed_kmh','heading','accuracy_m','matchedLat','matchedLon','wayId','matched'].join(',')]; for(const f of fx) rows.push([new Date(f.ts).toISOString(),f.lat,f.lon,f.speed,f.heading,f.accuracy??'',f.matchedLat??'',f.matchedLon??'',f.wayId??'',f.matched?1:0].join(','));

  function targetV(tt){ let a=tt%profTotal, prev=0; for(const [d,tv] of prof){ if(a<d){ return prev+(tv-prev)*Math.min(1,a/d); } a-=d; prev=tv; } return 0; }
  function at(sd){ let i=1; while(i<cum.length-1 && cum[i]<sd) i++; const f=(sd-cum[i-1])/((cum[i]-cum[i-1])||1); const a=co[i-1],b=co[i]; return { ll:[a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f], br: bearing(a,b) }; }
  setInterval(()=>{ t+=dt; const tv=targetV(t)/3.6; v += clamp(tv-v, -2.5*dt, 2.0*dt); s+=v*dt*dir; if(s>=total){ s=total; dir=-1; } if(s<=0){ s=0; dir=1; }
    const p=at(s); const br=(p.br+(dir<0?180:0))%360; const n=CONFIG.sim.noiseSigma; const ll=move(p.ll[0],p.ll[1],Math.random()*360, Math.abs(gauss())*n);
    onFix({ ts:Date.now(), lon:ll[0], lat:ll[1], spd: Math.max(0, v+gauss()*0.3), hdg: v>1? (br+gauss()*CONFIG.sim.hdgSigma+360)%360 : null, acc: 5+Math.abs(gauss())*4 }); }, dt*1000);
  toast('시뮬레이션: 인천 송도 (아암대로·컨벤시아대로·아카데미로)', 3000);
}
async function startReplay(id){ if(!LOG.db) await LOG.open().catch(()=>{}); const fx=(await LOG.fixes(id).catch(()=>[])).sort((a,b)=>a.ts-b.ts); if(!fx.length){ toast('재생할 기록이 없습니다: '+id, 4000); return; }
  toast(`재생: ${id} (${fx.length}점)`, 3000); let i=0; const step=()=>{ if(i>=fx.length){ toast('재생 종료'); return; } const f=fx[i]; onFix({ ts:f.ts, lon:f.lon, lat:f.lat, spd:f.speed/3.6, hdg:f.heading, acc:f.accuracy }); i++; if(i<fx.length) setTimeout(step, clamp(fx[i].ts-f.ts, 200, 3000)); }; step(); }
function startGps(){ if(!navigator.geolocation){ toast('이 브라우저는 위치 정보를 지원하지 않습니다', 5000); return; }
  navigator.geolocation.watchPosition(p=>{ const c=p.coords; onFix({ ts:p.timestamp, lon:c.longitude, lat:c.latitude, spd: c.speed!=null&&!isNaN(c.speed)? c.speed : null, hdg: c.heading!=null&&!isNaN(c.heading)? c.heading : null, acc:c.accuracy }); },
    e=>{ q('#badge').textContent = e.code===1? '위치 권한 거부됨' : 'GPS 오류 ('+e.code+')'; q('#badge').className='warn'; }, { enableHighAccuracy:true, maximumAge:0, timeout:20000 }); }

/* ---------- 시작: 한국 전역 초기 시점 → 첫 픽스 후 차량 추종 ---------- */
camera.setView({ destination: C.Cartesian3.fromDegrees(127.2, 36.3, 1400000) });
if(SIM) startSim(); else if(REPLAY) startReplay(REPLAY); else startGps();
addEventListener('resize', ()=>{ /* 앵커는 매 프레임 innerWidth/innerHeight 기반으로 재계산됨 */ });
window.__tesla = { S, CONFIG, ROADS, TILES, LOG, viewer };
</script>
