<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SISTECH SITE · 3D 타일 · 지적 · 부동산</title>
<script src="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.126/Build/Cesium/Widgets/widgets.css">
<style>
:root{
  --navy-950:#0A0E13; --navy-900:#0F151C; --navy:#17212B; --navy-700:#1F2D3A;
  --panel:rgba(14,19,26,.9); --panel-solid:#0F151C; --line:rgba(148,170,190,.18); --line-strong:rgba(148,170,190,.38);
  --text:#E6EDF3; --text-dim:#8B9AAB; --lime:#22D3EE; --lime-bright:#67E8F9; --lime-dim:rgba(34,211,238,.16);
  --amber:#F2A65A; --red:#FF5D5D; --cyan:#22D3EE; --sky:#7FB7F5; --acc:#22D3EE;
  --r:10px; --r-sm:7px; --tap:40px; --mSafeT:0px;
  --font:Inter,"Noto Sans KR","Segoe UI","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--navy-950);color:var(--text);font-family:var(--font);font-size:13px;overflow:hidden}
#cesium{position:fixed;inset:48px 0 26px 0}
#cesium .cesium-viewer-bottom{display:none}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,select{font-family:inherit}
.panel{background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 28px rgba(0,0,0,.45)}

/* 1. 상단 툴바 */
#top{position:fixed;left:0;right:0;top:0;height:48px;background:var(--panel-solid);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px;z-index:40}
#top .logo{display:flex;align-items:center;margin-right:8px}
#top .logo img{height:28px;width:auto;display:block;border-radius:4px}
#top .tools{display:flex;gap:2px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:2px}
#top .tools button{height:30px;padding:0 11px;border-radius:6px;font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:6px;white-space:nowrap}
#top .tools button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#top .tools button.on{background:var(--acc);color:#07141A;font-weight:700}
#crumb{margin:0 auto;font-weight:600;font-size:13px;color:var(--text);display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#crumb span{color:var(--text-dim);font-weight:400}
#crumb b{font-weight:600;color:var(--text)}
#crumb i{font-style:normal;color:var(--text-dim);opacity:.6}
#top .rt{display:flex;gap:2px;margin-left:auto}
#top .rt button{height:32px;padding:0 10px;border-radius:7px;color:var(--text-dim);font-size:12.5px;display:flex;align-items:center;gap:6px}
#top .rt button:hover{background:rgba(255,255,255,.06);color:#fff}
#top .rt button.on{color:var(--acc)}
#top .rt svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#btnLayersM{display:none}

/* 2. 좌측 검색 + 레이어 카드 */
#lpanel{position:fixed;left:10px;top:58px;width:290px;z-index:30;display:flex;flex-direction:column;max-height:calc(100vh - 100px)}
#lpanel .q{position:relative;padding:8px}
#lpanel .q input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:rgba(255,255,255,.04);color:#fff;padding:0 64px 0 32px;font-size:13px}
#lpanel .q svg{position:absolute;left:18px;top:18px;width:15px;height:15px;stroke:var(--text-dim);fill:none;stroke-width:2;stroke-linecap:round}
#lpanel .q kbd{position:absolute;right:18px;top:16px;font-family:inherit;font-size:10.5px;color:var(--text-dim);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
#qres{list-style:none;margin:0 8px;padding:4px 0;max-height:240px;overflow:auto;display:none;border:1px solid var(--line-strong);border-radius:8px;background:var(--panel-solid)}
#qres.open{display:block}
#qres li{padding:7px 10px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;font-size:12.5px}
#qres li:hover{background:rgba(255,255,255,.06)}
#qres li small{color:var(--text-dim)}
#lhead{display:flex;align-items:center;justify-content:space-between;padding:6px 12px 6px;border-top:1px solid var(--line);font-size:11.5px;color:var(--text-dim);letter-spacing:.06em;cursor:pointer;user-select:none}
#lhead b{color:var(--text);font-weight:600;letter-spacing:0}
#lhead .cnt{color:var(--acc);font-weight:600}
#lhead i{font-style:normal;transition:.2s}
#lpanel.fold #lhead i{transform:rotate(-90deg)}
#lpanel.fold #layers{display:none}
#layers{overflow:auto;padding:0 6px 6px}
.grp{border-top:1px solid var(--line)}
.grp .gh{display:flex;align-items:center;gap:8px;padding:8px 6px 6px;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;user-select:none}
.grp .gh small{margin-left:auto;font-weight:400;color:var(--text-dim)}
.grp .gh i{font-style:normal;color:var(--text-dim);transition:.2s;font-size:11px}
.grp.fold .gh i{transform:rotate(-90deg)}
.grp.fold .gi{display:none}
.li{display:flex;align-items:center;gap:9px;width:100%;padding:7px 6px;border-radius:7px;text-align:left;color:var(--text);font-size:12.5px}
.li:hover{background:rgba(255,255,255,.05)}
.li .sw{flex:none;width:30px;height:17px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;transition:.2s}
.li .sw::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:.2s}
.li.on .sw{background:var(--acc)}
.li.on .sw::after{left:15px;background:#07141A}
.li .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.li .t b{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on .t b{color:#fff}
.li .t span{font-size:11px;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .badge{flex:none;font-size:10px;padding:1px 6px;border-radius:999px;border:1px solid var(--line);color:var(--text-dim)}
.sub{padding:2px 6px 6px 14px;display:flex;flex-direction:column;gap:4px}
.pj{display:flex;align-items:center;gap:8px;font-size:12px;padding:3px 0}
.pj .dot{width:7px;height:7px;border-radius:50%;background:var(--text-dim);flex:none}
.pj.loaded .dot{background:var(--acc);box-shadow:0 0 6px var(--acc)}
.pj b{font-weight:500;flex:1}
.pj small{color:var(--text-dim)}
.pj button{font-size:11px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);color:var(--text)}
.pj button:hover{border-color:var(--acc);color:#fff}
.op{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--text-dim);padding:4px 0 0}
.op input[type=range]{flex:1;accent-color:var(--acc);height:3px}
.op b{color:var(--text);font-weight:500;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}

/* 3. 우측 컨트롤 */
#ctl{position:fixed;right:10px;bottom:46px;z-index:30;display:flex;flex-direction:column;gap:5px;align-items:center}
#ctl button{width:36px;height:36px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;color:var(--text);font-size:15px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#ctl button:hover{border-color:var(--acc);color:#fff}
#ctl button.on{background:var(--acc);color:#07141A;border-color:var(--acc)}
#ctl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#ctl .compass svg{transition:transform .15s}
#ctl .compass .n{fill:var(--red);stroke:none}
#ctl .compass .s{fill:#fff;stroke:none;opacity:.9}
#ctl .grp2{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.4)}
#ctl .grp2 button{border-radius:0;border:0;box-shadow:none;background:transparent;width:36px;height:34px}
#ctl .grp2 button+button{border-top:1px solid var(--line)}

/* 4. 바텀 시트 (지점 카드) */
#card{position:fixed;left:50%;transform:translateX(-50%);bottom:34px;width:min(560px,calc(100vw - 120px));max-height:52vh;z-index:35;display:none;flex-direction:column;overflow:hidden}
#card.open{display:flex}
#card.full{max-height:calc(100vh - 100px)}
#card.min .body,#card.min #cardChips{display:none}
#card .handle{height:16px;display:grid;place-items:center;cursor:grab;flex:none;touch-action:none}
#card .handle::before{content:"";width:34px;height:4px;border-radius:2px;background:var(--text-dim);opacity:.55}
#card .hd{display:flex;align-items:flex-start;gap:10px;padding:0 14px 8px;flex:none}
#card .hd h2{margin:0;font-size:15px;font-weight:700;flex:1;line-height:1.3;min-width:0}
#card .hd h2 small{display:block;font-weight:400;color:var(--text-dim);font-size:11.5px;margin-top:2px}
#card .hd button{color:var(--text-dim);font-size:17px;line-height:1;padding:0 2px;flex:none}
#cardChips{display:flex;gap:5px;padding:0 14px 8px;flex-wrap:wrap;flex:none}
#cardChips button{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text)}
#cardChips button.on{border-color:var(--acc);color:var(--acc)}
#card .body{overflow:auto;padding:0 14px 12px;border-top:1px solid var(--line)}
.sec{padding:11px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec .lead{font-size:13px;line-height:1.55;margin:0 0 8px}
.sec .lead b{color:#fff}
.sec h3{font-size:13px}
.kv{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:12.5px}
.kv div{color:var(--text-dim)}
.kv div b{color:#fff;font-weight:600;margin-left:4px}
.meta{margin-top:8px;font-size:11px;color:var(--text-dim);line-height:1.5;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.tag{font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 6px;border-radius:4px}
.tag.obs{background:var(--lime);color:#07141A}
.tag.model{background:rgba(127,183,245,.2);color:var(--sky);border:1px solid rgba(127,183,245,.4)}
.tag.derived{background:rgba(242,166,90,.18);color:var(--amber);border:1px solid rgba(242,166,90,.4)}
.tag.drone{background:var(--navy);color:var(--lime-bright);border:1px solid var(--lime)}
.fly{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--r-sm);font-weight:700;font-size:13px;margin-bottom:8px}
.fly.ok{background:var(--lime-dim);color:var(--lime-bright);border:1px solid rgba(34,211,238,.5)}
.fly.warn{background:rgba(242,166,90,.15);color:var(--amber);border:1px solid rgba(242,166,90,.5)}
.fly.bad{background:rgba(255,93,93,.15);color:var(--red);border:1px solid rgba(255,93,93,.5)}
.warn{color:var(--amber)}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:10px;border-radius:var(--r-sm);background:var(--acc);color:#07141A;font-weight:800;font-size:13px;text-decoration:none;margin-top:10px}
.cta:hover{background:var(--lime-bright)}
.cta.ghost{background:transparent;color:var(--text);border:1px solid var(--line-strong);font-weight:600}
.skeleton{height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(255,255,255,.06),rgba(255,255,255,.14),rgba(255,255,255,.06));background-size:200% 100%;animation:sk 1.2s infinite;margin:6px 0}
@keyframes sk{to{background-position:-200% 0}}
.seg{display:flex;gap:3px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:999px;padding:2px}
.seg button{padding:4px 11px;border-radius:999px;font-size:12px;color:var(--text-dim)}
.seg button.on{background:var(--acc);color:#07141A;font-weight:700}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.note{font-size:11.5px;color:var(--text-dim);line-height:1.5}

/* 설정 팝오버 */
#settings{position:fixed;right:10px;top:56px;width:300px;z-index:45;display:none;padding:12px 14px}
#settings.open{display:block}
#settings h3{margin:0 0 6px;font-size:12px;color:var(--text-dim);font-weight:600;letter-spacing:.06em}

/* 5. 하단 상태바 */
#bar{position:fixed;left:0;right:0;bottom:0;height:26px;background:var(--panel-solid);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 10px;font-size:11px;color:var(--text-dim);font-variant-numeric:tabular-nums;z-index:40;white-space:nowrap;overflow:hidden}
#bar b{color:var(--text);font-weight:500}
#bar .acc{color:var(--acc);font-weight:600}
#bar .sp{margin-left:auto}
#bar .sc{display:inline-flex;align-items:center;gap:5px}
#bar .sc i{display:inline-block;height:5px;border-bottom:1.5px solid var(--text-dim);border-left:1.5px solid var(--text-dim);border-right:1.5px solid var(--text-dim);width:60px}

#toast{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:60;padding:8px 14px;font-size:12.5px;display:none;max-width:min(92vw,560px);text-align:center}
#toast.open{display:block}
#cadLegend{left:auto!important;right:56px!important;transform:none!important;bottom:34px!important;max-width:min(60vw,360px)!important;z-index:21}
#vsHud{top:56px!important}
.cesium-widget-credits{display:none!important}

/* 모바일 */
@media (max-width:600px){
  #top{padding:0 6px;gap:4px}
  #top .logo{margin-right:2px}#top .logo img{height:24px}
  #top .tools button{padding:0 8px}
  #top .tools button .lb{display:none}
  #crumb{position:fixed;top:54px;left:8px;margin:0;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:11.5px;max-width:62vw;z-index:30}
  #crumb .l1{display:none}
  #crumb .l1 + i{display:none}
  #top .rt button .lb{display:none}
  #btnLayersM{display:flex}
  #lpanel{left:0;right:0;top:auto;bottom:26px;width:auto;max-height:62vh;border-radius:12px 12px 0 0;transform:translateY(105%);transition:transform .25s}
  #lpanel.open{transform:none}
  #lpanel.fold #layers{display:block}
  #ctl{bottom:40px;right:8px}
  #card{left:0;right:0;transform:none;width:auto;bottom:26px;border-radius:12px 12px 0 0;max-height:56vh}
  #card.full{max-height:calc(100vh - 60px)}
  #settings{right:6px;left:6px;width:auto}
  #bar{gap:10px;font-size:10.5px}
  #bar .hide-s{display:none}
  #cadLegend{left:8px!important;right:56px!important;max-width:none!important;bottom:30px!important;font-size:10px!important}
}
</style>
</head>

const TILESET_BASE = 'https://3dview.sistech3d.com/api/tileset/project/';
const LOAD_KM = 20, UNLOAD_KM = 40, MAX_ACTIVE = 2, CACHE = 768*1024*1024;
let ensureTileset = async function(p){
  if(!p.tsId || p.ts || p.tsLoading) return p.ts;
  p.tsLoading = true; toast(`${p.name} 3D 모델 불러오는 중…`); renderLayers();
  try{
    const ts = await Cesium.Cesium3DTileset.fromUrl(`${TILESET_BASE}${p.tsId}/tileset.json`, { maximumScreenSpaceError: STATE.sse, skipLevelOfDetail: true, dynamicScreenSpaceError: true, cacheBytes: CACHE, maximumCacheOverflowBytes: CACHE, foveatedScreenSpaceError: true });
    p.ts = ts; scene.primitives.add(ts); ts.show = STATE.on.has('tiles'); applyTsStyle(ts);
    toast(`${p.name} 3D 모델 로드 완료 · SISTECH 드론 3D Tiles`);
  }catch(e){ toast(`${p.name} 3D 모델 로드 실패: ${e.message}`, 5000); }
  p.tsLoading = false; renderLayers(); updateSrc(); return p.ts;
};
function applyTsStyle(ts){ ts.style = new Cesium.Cesium3DTileStyle({ color: `color('white', ${STATE.tsAlpha})` }); ts.maximumScreenSpaceError = STATE.sse; }
function viewCenterCarto(){ const cv = scene.canvas; let c = null; try{ c = camera.pickEllipsoid(new Cesium.Cartesian2(cv.clientWidth/2, cv.clientHeight/2), globe.ellipsoid); }catch(e){} return c ? Cesium.Cartographic.fromCartesian(c) : camera.positionCartographic; }
function distKm(p, ctr){ ctr = ctr || viewCenterCarto(); return new Cesium.EllipsoidGeodesic(new Cesium.Cartographic(ctr.longitude, ctr.latitude), Cesium.Cartographic.fromDegrees(p.lon, p.lat)).surfaceDistance/1000; }
let autoLoadTileset = function(){
  if(!STATE.on.has('tiles')) return;
  const ctr = viewCenterCarto(); const h = camera.positionCartographic.height;
  const models = PROJECTS.filter(p=>p.tsId).map(p=>({ p, d: distKm(p, ctr) })).sort((a,b)=>a.d-b.d);
  let active = 0, changed = false;
  for(const {p, d} of models){
    if(d > UNLOAD_KM){ if(p.ts){ try{ scene.primitives.remove(p.ts); }catch(e){} p.ts = null; changed = true; } continue; }
    const want = h <= 120000 && d <= LOAD_KM && active < MAX_ACTIVE;
    if(want){ active++; if(!p.ts) ensureTileset(p); else if(!p.ts.show){ p.ts.show = true; changed = true; } } else if(p.ts && p.ts.show){ p.ts.show = false; changed = true; }
  }
  if(changed) renderLayers();
};
function flyToProject(id){
  const p = PROJECTS.find(x=>x.id===id); if(!p) return;
  if(window.sistech2D && window.sistech2D.on) window.sistech2D.exit(true);
  camera.flyTo({ destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat-0.0253, 2200), orientation:{ heading:0, pitch:Cesium.Math.toRadians(-38), roll:0 }, duration: 2.6, complete:()=>{ autoLoadTileset(); toast(`${p.name} · ${p.desc}`); } });
}

/* ---------- 화질 자동 (index 22 이식·축약): 기기 등급 + 고도 → 고/중/저 ---------- */
let cycleQuality = function(){};
(function(){
  const SSE = { '고':6, '중':16, '저':32 };
  let renderer = ''; try{ const gl = scene.context._gl; const ext = gl.getExtension('WEBGL_debug_renderer_info'); renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER); }catch(e){}
  const mobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  let tier = '중';
  if(/RTX|GTX 1[6-9]|GTX [2-9]\d|Radeon RX|Radeon Pro|Arc\(TM\) A|Arc A|Apple M\d (Pro|Max|Ultra)/i.test(renderer) && !mobile) tier = '상';
  else if(mobile || /UHD|HD Graphics|Mali|Adreno|PowerVR|SwiftShader|llvmpipe|Basic Render/i.test(renderer) || (navigator.deviceMemory && navigator.deviceMemory <= 4)) tier = '하';
  const TIER = { '상': { hi: 800, mid: 4000, max:'고', msaa:4, budget:1000 }, '중': { hi: 400, mid: 2500, max:'고', msaa:2, budget:600 }, '하': { hi: 0, mid: 1000, max:'중', msaa:1, budget:350 } };
  const T = () => TIER[tier];
  const pxFactor = () => Math.max(0.85, Math.min(1.6, Math.sqrt(scene.context.drawingBufferHeight / 1080)));
  const LS = { get:k=>{ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} } };
  const S = { mode: LS.get('q.mode') || '자동', level:'중', perfDown:0, fpsLow:0, fpsHigh:0, fps:null };
  function groundAlt(){ const c = camera.positionCartographic; let g = 0; try{ g = globe.getHeight(c) || 0; }catch(e){} return Math.max(0, c.height - g); }
  function levelForAlt(h){ const t = T(); const cur = S.level; const k = 0.15; const hiB = t.hi*(cur==='고'?1+k:1-k), midB = t.mid*(cur==='저'?1-k:1+k); let L = h <= hiB ? '고' : h <= midB ? '중' : '저'; if(t.max==='중' && L==='고') L = '중'; return L; }
  function apply(){
    const h = groundAlt(); let L = S.mode==='자동' ? levelForAlt(h) : S.mode; if(S.mode==='자동' && S.perfDown && L==='고') L = '중';
    const mem = PROJECTS.reduce((s,p)=>s+(p.ts? p.ts.totalMemoryUsageInBytes/1048576 : 0), 0);
    let sse = SSE[L]*pxFactor(); if(S.mode==='자동' && mem > T().budget) sse *= 1.3; sse = Math.round(sse*10)/10;
    S.level = L; STATE.quality = L; STATE.sse = sse;
    for(const p of PROJECTS) if(p.ts && Math.abs(p.ts.maximumScreenSpaceError - sse) > 0.05) p.ts.maximumScreenSpaceError = sse;
    S.alt = h; S.mem = mem; S.sse = sse; label();
  }
  let frames = 0; scene.postRender.addEventListener(()=>frames++);
  setInterval(()=>{ const f = frames/4; frames = 0; if(document.visibilityState!=='visible') return; S.fps = f; if(S.mode!=='자동') return;
    if(f < 15){ S.fpsLow++; S.fpsHigh = 0; if(S.fpsLow >= 3 && S.perfDown < 1 && S.level==='고'){ S.perfDown++; S.fpsLow = 0; toast('화면이 느려 3D 화질을 한 단계 낮췄습니다', 2500); apply(); } }
    else if(f > 40){ S.fpsHigh++; S.fpsLow = 0; if(S.fpsHigh >= 3 && S.perfDown > 0){ S.perfDown--; S.fpsHigh = 0; apply(); } } else { S.fpsLow = 0; S.fpsHigh = 0; } }, 4000);
  try{ scene.msaaSamples = T().msaa; if(T().msaa <= 1) scene.postProcessStages.fxaa.enabled = true; }catch(e){}
  function label(){ const el = $('#qInfo'); if(el) el.textContent = (S.mode==='자동' ? '자동 · 지금 '+S.level : S.mode+' 고정')+' · SSE '+S.sse; $('#segQ').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.v===S.mode)); }
  $('#segQ').querySelectorAll('button').forEach(b => b.onclick = () => { S.mode = b.dataset.v; LS.set('q.mode', S.mode); S.perfDown = 0; apply(); toast(S.mode==='자동' ? '3D 화질 자동' : '3D 화질 '+S.mode+' 고정', 1600); });
  cycleQuality = function(){ const seq = ['자동','저','중','고']; S.mode = seq[(seq.indexOf(S.mode)+1)%seq.length]; LS.set('q.mode', S.mode); S.perfDown = 0; apply(); };
  let lastPos = null; setInterval(()=>{ const p = camera.position; if(!lastPos || Cesium.Cartesian3.distance(p, lastPos) > 5){ lastPos = p.clone(); apply(); } }, 700);
  camera.moveEnd.addEventListener(apply);
  const _ens2 = ensureTileset; ensureTileset = async function(p){ const ts = await _ens2(p); if(ts) ts.maximumScreenSpaceError = STATE.sse; return ts; };
  window.sistechQuality = { S, tier, renderer, apply };
  apply();
})();

/* ---------- 저사양 최적화 (index 58 이식·축약) ---------- */
(function(){
  let renderer = ''; try{ renderer = window.sistechQuality.renderer || ''; }catch(e){}
  const mobile = /Android|iPhone|iPad/i.test(navigator.userAgent);
  const integrated = mobile || /Intel|Iris|UHD|HD Graphics|Mali|Adreno|PowerVR|Apple GPU|SwiftShader|llvmpipe|Basic Render|Radeon\(TM\) Graphics|Vega \d+ Graphics/i.test(renderer);
  let saved58 = null; try{ saved58 = localStorage.getItem('perf58'); }catch(e){}
  const P = { on: (saved58 || (integrated ? 'on' : 'off')) === 'on', integrated, idle:false, last: performance.now(), moving:false };
  function applyGlobe(){ globe.maximumScreenSpaceError = P.on ? 4 : 2; }
  const IDLE_MS = 8000, IDLE_FPS = 6;
  function busy(){ if(P.moving) return true; for(const p of PROJECTS) if(p.ts && p.ts.show && !p.ts.tilesLoaded) return true; return false; }
  function setIdle(v){ if(P.idle === v) return; P.idle = v; viewer.targetFrameRate = v ? IDLE_FPS : undefined; }
  function wake(){ P.last = performance.now(); setIdle(false); }
  ['pointerdown','pointermove','wheel','keydown','touchstart'].forEach(t => window.addEventListener(t, wake, { passive:true, capture:true }));
  camera.moveStart.addEventListener(() => { P.moving = true; wake(); }); camera.moveEnd.addEventListener(() => { P.moving = false; P.last = performance.now(); });
  setInterval(() => { if(!P.on){ setIdle(false); return; } if(busy()){ P.last = performance.now(); setIdle(false); return; } if(performance.now() - P.last > IDLE_MS) setIdle(true); }, 1000);
  const seg = $('#segPerf'); const paint = () => seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', (b.dataset.v==='on')===P.on));
  seg.querySelectorAll('button').forEach(b => b.onclick = () => { P.on = b.dataset.v==='on'; try{ localStorage.setItem('perf58', P.on?'on':'off'); }catch(e){} applyGlobe(); wake(); paint(); });

})();

/* ---------- 2D/3D (index 47 이식): 2D = 연직 직교투영 정사 보기 ---------- */
(function(){

    const g = C.Cartographic.fromCartesian(c); const dist = Math.max(150, C.Cartesian3.distance(camera.positionWC, c));

(function(){

  document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('#lpanel').classList.add('open'); q.focus(); q.select(); } });
})();

<script>

/* ---------- 16. SITE › 분석 › 가시권 (관측점 드래그 지정 → 깊이 버퍼 기반 가시/비가시 격자 · 관측점 시점 보기) ---------- */
(function(){

  const D2R = Math.PI/180;

  }
  /* 계산: 관측점 시점으로 렌더 → 깊이 버퍼 전체 읽기 → 보이는 표면점 → 극좌표 격자 */
  function compute(){

    const saved = { pos: camera.position.clone(), dir: camera.direction.clone(), up: camera.up.clone(), fov: camera.frustum.fov, dtt: globe.depthTestAgainstTerrain };
    const ctx = scene.context, W = ctx.drawingBufferWidth, H = ctx.drawingBufferHeight; const aspect = W/H;
    const fovH = Math.min(VS.hfov, 100); const nH = Math.ceil(VS.hfov/fovH - 1e-6); const fovHr = fovH*D2R; const fovV = 2*Math.atan(Math.tan(fovHr/2)/aspect)/D2R; const nV = Math.ceil(VS.vfov/fovV - 1e-6);

          const d = Cesium.Cartesian3.subtract(c, O, new Cesium.Cartesian3()); const e = Cesium.Cartesian3.dot(d, enu.east), n = Cesium.Cartesian3.dot(d, enu.north), u = Cesium.Cartesian3.dot(d, enu.up); const rg = Math.hypot(e, n); if(rg < 0.5 || rg > VS.radius) continue;
          const az = Math.atan2(e, n)/D2R; const rel = ((az - azStart) % 360 + 360) % 360; if(rel >= VS.hfov) continue; const el = Math.atan2(u, rg)/D2R; if(el < VS.pitch - VS.vfov/2 || el > VS.pitch + VS.vfov/2) continue;
          const ai = Math.min(na-1, Math.floor(rel/da)), ri = Math.min(nr-1, Math.floor(rg/dr)); cnt[ri*na+ai]++; kept++; if(rg > maxVis[ri*na+ai]) maxVis[ri*na+ai] = rg; }
      } }
      delete pd.getDepth;
    }catch(e){ console.error(e); toast('가시권 계산 오류: '+e.message, 5000); }
    camera.setView({ destination: saved.pos, orientation:{ direction: saved.dir, up: saved.up } }); camera.frustum.fov = saved.fov; globe.depthTestAgainstTerrain = saved.dtt;
    // 격자 생성
    clearResult(); previewWedge();
    const vis=[], hid=[], out=[]; let visArea=0, hidArea=0, farthest=0;
    for(let ri=0; ri<nr; ri++){ for(let ai=0; ai<na; ai++){ const r0 = ri*dr, r1 = r0+dr; const a0 = (azStart + ai*da)*D2R, a1 = (azStart + (ai+1)*da)*D2R; const area = 0.5*(r1*r1 - r0*r0)*(a1-a0);
      const rc = (r0+r1)/2; const elC = Math.atan2(-VS.eye, rc)/D2R; const inV = elC >= VS.pitch - VS.vfov/2 - 2 && elC <= VS.pitch + VS.vfov/2 + 2;
      const k = ri*na+ai; const st = cnt[k] > 0 ? 'vis' : (inV ? 'hid' : 'out'); if(st==='vis'){ visArea += area; if(maxVis[k] > farthest) farthest = maxVis[k]; } else if(st==='hid') hidArea += area;
      const poly = [localPoint(enu, r0*Math.sin(a0), r0*Math.cos(a0), 0), localPoint(enu, r1*Math.sin(a0), r1*Math.cos(a0), 0), localPoint(enu, r1*Math.sin(a1), r1*Math.cos(a1), 0), localPoint(enu, r0*Math.sin(a1), r0*Math.cos(a1), 0)];
      if(ri===0){ poly[0] = localPoint(enu, 0.3*Math.sin(a0), 0.3*Math.cos(a0), 0); poly[3] = localPoint(enu, 0.3*Math.sin(a1), 0.3*Math.cos(a1), 0); }

    for(const arr of [out, hid, vis]){ if(!arr.length) continue; const gp = new Cesium.GroundPrimitive({ geometryInstances: arr, appearance: new Cesium.PerInstanceColorAppearance({ flat:true }), classificationType: Cesium.ClassificationType.BOTH, asynchronous: true }); gp.show = !VS.fp; scene.primitives.add(gp); VS.prims.push(gp); }
    const tot = visArea + hidArea; VS.stats = { visArea, hidArea, pct: tot? visArea/tot*100 : 0, farthest, samples, kept, cells: na*nr };
    VS.busy = false; setHud('가시권 · 보이는 면적 '+Math.round(VS.stats.pct)+'% · 방위 '+Math.round(VS.heading)+'° · 가로 '+VS.hfov+'° / 세로 '+VS.vfov+'° · 반경 '+VS.radius+' m');
    renderCard();
  }
  /* 관측점 시점 보기 */
  function applyFpCamera(){ if(!VS.fp || !VS.O) return; camera.setView({ destination: VS.O, orientation:{ heading: VS.heading*D2R, pitch: VS.pitch*D2R, roll:0 } }); }
  function syncSliders(){ const h=$('#vsH'), p=$('#vsP'), hn=$('#vsHN'), pn=$('#vsPN'); if(h){ h.value = Math.round(VS.heading); if(hn) hn.value = Math.round(VS.heading); } if(p){ p.value = Math.round(VS.pitch); if(pn) pn.value = Math.round(VS.pitch); } }
  let keyTimer = null; function scheduleCompute(ms){ clearTimeout(keyTimer); keyTimer = setTimeout(()=>{ if(VS.active && VS.ground && !VS.busy) compute(); }, ms||700); }
  function fpHud(){ setHud('관측점 시점 · 방위 '+Math.round(VS.heading)+'° · 상하 '+Math.round(VS.pitch)+'° · ← → 좌우 회전 · ↑ ↓ 위아래 (Shift: 10°씩) · 마우스 드래그로 둘러보기'); }
  document.addEventListener('keydown', e=>{ if(!VS.active || !VS.fp) return; const t = e.target; if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return; const step = e.shiftKey?10:3; let used=true;
    if(e.key==='ArrowRight') VS.heading = (VS.heading+step)%360; else if(e.key==='ArrowLeft') VS.heading = (VS.heading-step+360)%360; else if(e.key==='ArrowUp') VS.pitch = Math.min(60, VS.pitch+step); else if(e.key==='ArrowDown') VS.pitch = Math.max(-80, VS.pitch-step); else used=false;
    if(!used) return; e.preventDefault(); applyFpCamera(); syncSliders(); previewWedge(); fpHud(); scheduleCompute(700); });
  function firstPerson(){ if(!VS.O) return; if(!VS.saved) VS.saved = { pos: camera.position.clone(), dir: camera.direction.clone(), up: camera.up.clone(), fov: camera.frustum.fov };
    const cc = scene.screenSpaceCameraController; if(!VS.savedCtrl){ VS.savedCtrl = { rotate: cc.rotateEventTypes, tilt: cc.tiltEventTypes, translate: cc.translateEventTypes, zoom: cc.zoomEventTypes, look: cc.lookEventTypes, pct: camera.percentageChanged }; }
    cc.rotateEventTypes = []; cc.tiltEventTypes = []; cc.translateEventTypes = []; cc.zoomEventTypes = []; cc.lookEventTypes = Cesium.CameraEventType.LEFT_DRAG; camera.percentageChanged = 0.005;
    if(!VS.camListener){ VS.camListener = camera.changed.addEventListener(()=>{ if(!VS.fp || VS.busy || !VS.O) return; const h = ((camera.heading/D2R)%360+360)%360, p = camera.pitch/D2R; if(Math.abs(h-VS.heading)>0.3 || Math.abs(p-VS.pitch)>0.3){ VS.heading = h; VS.pitch = Math.max(-80, Math.min(60, p)); syncSliders(); previewWedge(); fpHud(); scheduleCompute(900); } }); }
    VS.savedCol = scene.screenSpaceCameraController.enableCollisionDetection; scene.screenSpaceCameraController.enableCollisionDetection = false; camera.setView({ destination: VS.O, orientation:{ heading: VS.heading*D2R, pitch: VS.pitch*D2R, roll:0 } }); camera.frustum.fov = Math.min(150, Math.max(10, VS.hfov))*D2R; VS.fp = true; for(const p of VS.prims) p.show = false; fpHud(); toast('관측점 시점 · 가로 시야각 '+Math.min(150,VS.hfov)+'° · 화살표 키로 회전, 마우스 드래그로 둘러보기 · "원래 시점으로"로 복귀', 4000); renderCard(); }
  function restoreView(){ const cc = scene.screenSpaceCameraController; if(VS.savedCtrl){ cc.rotateEventTypes = VS.savedCtrl.rotate; cc.tiltEventTypes = VS.savedCtrl.tilt; cc.translateEventTypes = VS.savedCtrl.translate; cc.zoomEventTypes = VS.savedCtrl.zoom; cc.lookEventTypes = VS.savedCtrl.look; camera.percentageChanged = VS.savedCtrl.pct; VS.savedCtrl = null; } if(VS.camListener){ VS.camListener(); VS.camListener = null; } if(VS.savedCol!=null){ scene.screenSpaceCameraController.enableCollisionDetection = VS.savedCol; VS.savedCol = null; } if(VS.saved){ camera.setView({ destination: VS.saved.pos, orientation:{ direction: VS.saved.dir, up: VS.saved.up } }); camera.frustum.fov = VS.saved.fov; } VS.saved = null; VS.fp = false; for(const p of VS.prims) p.show = true; if(VS.stats) setHud('가시권 · 보이는 면적 '+Math.round(VS.stats.pct)+'% · 방위 '+Math.round(VS.heading)+'° · 가로 '+VS.hfov+'° / 세로 '+VS.vfov+'° · 반경 '+VS.radius+' m'); renderCard(); }
  /* 카드 */
  function renderCard(){
    if(!VS.active) return; STATE.point = null; $('#card').classList.add('open');
    $('#cardTitle').innerHTML = '가시권 분석<small>'+(VS.ground? '관측점 지정됨 · 깊이 버퍼 기반 (DERIVED)' : '관측점을 지정하세요')+'</small>';
    const S = VS.stats;
    const slider = (id, label, min, max, step, val, unit, tip) => '<div style="display:flex;align-items:center;gap:8px;margin:4px 0;font-size:12.5px" title="'+(tip||'')+'"><span style="color:var(--text-dim);width:70px;white-space:nowrap">'+label+'</span><input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" style="flex:1"><input type="number" id="'+id+'N" min="'+min+'" max="'+max+'" step="'+step+'" value="'+val+'" style="width:58px;background:var(--panel-2,#0b1a30);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:3px 4px;font-size:12.5px;text-align:right"><span style="color:var(--text-dim);min-width:18px">'+unit.trim()+'</span></div>';

        : '<p class="lead"><b>3D 모델 위 관측 지점을 누른 채</b> 보고 싶은 방향으로 끌어서 놓으세요. 끈 거리가 분석 반경이 됩니다. (클릭만 하면 아래 값으로 계산)</p>')
      + '</div><div class="sec"><h4 style="margin:0 0 6px;font-size:13px">시야 설정</h4>'
      + slider('vsH','방향(방위)',0,359,1,Math.round(VS.heading),'°','시선 중심의 방위각 (0 북, 90 동)') + slider('vsHf','가로 시야폭',10,360,5,VS.hfov,'°','좌우로 보이는 각도 폭') + slider('vsVf','세로 시야폭',10,120,5,VS.vfov,'°','위아래로 보이는 각도 폭 (시야 원뿔의 높이)') + slider('vsP','상하 기울기',-80,60,1,Math.round(VS.pitch),'°','시선 중심을 위(+)/아래(-)로 기울이는 각도') + slider('vsR','반경',30,2000,10,VS.radius,' m','분석 거리') + slider('vsE','눈높이',0.5,50,0.5,VS.eye,' m','관측점 지면 위 눈높이')
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><button class="cta" id="vsFp" style="flex:1;margin:0"'+(VS.ground?'':' disabled')+'>'+(VS.fp?'관측점 시점 (보는 중)':'👁 이 지점에서 보기')+'</button><button class="cta ghost" id="vsBack" style="flex:1;margin:0"'+(VS.fp?'':' disabled')+'>원래 시점으로</button></div>'
      + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button class="cta ghost" id="vsRe" style="flex:1;margin:0">관측점 다시 지정</button><button class="cta ghost" id="vsCalc" style="flex:1;margin:0"'+(VS.ground?'':' disabled')+'>다시 계산</button></div>'
      + '<div class="meta">세로 시야폭 = 위아래로 보이는 각도 범위, 상하 기울기 = 그 범위의 중심을 위/아래로 기울이는 각도. 숫자 칸에 직접 입력해도 됩니다. 관측점 시점에서는 색 격자가 숨겨지고(화살표 키·마우스 드래그로 둘러보기), 원래 시점으로 돌아오면 다시 표시됩니다.</div></div>';
    const bind = (id, key, fmt) => { const el = $('#'+id), nb = $('#'+id+'N'); if(!el) return; const apply = v=>{ VS[key] = v; if(nb) nb.value = v; el.value = v; if(VS.ground && !VS.busy) previewWedge(); if((key==='heading'||key==='pitch') && VS.fp){ applyFpCamera(); fpHud(); } }; el.oninput = e=>apply(+e.target.value); el.onchange = ()=>{ if(VS.ground) setTimeout(compute, 30); }; if(nb){ nb.onchange = e=>{ let v = +e.target.value; if(isNaN(v)) return; const mn=+nb.min, mx=+nb.max; if(key==='heading') v = ((v%360)+360)%360; else v = Math.max(mn, Math.min(mx, v)); apply(v); if(VS.ground) setTimeout(compute, 30); }; nb.onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); nb.blur(); } e.stopPropagation(); }; } };
    bind('vsH','heading',v=>v+'°'); bind('vsHf','hfov',v=>v+'°'); bind('vsVf','vfov',v=>v+'°'); bind('vsP','pitch',v=>v+'°'); bind('vsR','radius',v=>v+' m'); bind('vsE','eye',v=>v+' m');
    $('#vsFp').onclick = firstPerson; $('#vsBack').onclick = restoreView; $('#vsRe').onclick = ()=>{ if(VS.fp) restoreView(); arm(); }; $('#vsCalc').onclick = ()=>setTimeout(compute, 30);
  }
  /* 드래그 입력 */
  function arm(){ VS.armed = true; VS.dragging = false; clearResult(); VS.ground = null; VS.O = null; setHud('3D 모델 위 <b>관측 지점을 누른 채</b> 보고 싶은 방향으로 끌어서 놓으세요'); renderCard(); }
  function ensureHandler(){ if(VS.handler) return; const h = new Cesium.ScreenSpaceEventHandler(scene.canvas); VS.handler = h;
    h.setInputAction(e=>{ if(!VS.active || !VS.armed || VS.busy) return; const g = pickGround(e.position); if(!g) return; VS.ground = g; VS.dragging = true; scene.screenSpaceCameraController.enableInputs = false; previewWedge(); setHud('방향으로 끌어서 놓으세요 · 끈 거리 = 반경'); }, Cesium.ScreenSpaceEventType.LEFT_DOWN);
    h.setInputAction(e=>{ if(!VS.dragging) return; const g = pickGround(e.endPosition); if(!g) return; const enu = enuOf(VS.ground); const d = Cesium.Cartesian3.subtract(g, VS.ground, new Cesium.Cartesian3()); const ea = Cesium.Cartesian3.dot(d, enu.east), no = Cesium.Cartesian3.dot(d, enu.north); const rg = Math.hypot(ea, no); if(rg > 3){ VS.heading = ((Math.atan2(ea, no)/D2R) + 360) % 360; VS.radius = Math.max(30, Math.min(2000, Math.round(rg/10)*10)); } previewWedge(); setHud('방위 '+Math.round(VS.heading)+'° · 반경 '+VS.radius+' m · 놓으면 계산'); }, Cesium.ScreenSpaceEventType.MOUSE_MOVE);
    h.setInputAction(e=>{ if(!VS.dragging) return; VS.dragging = false; VS.armed = false; VS.justDone = true; scene.screenSpaceCameraController.enableInputs = true; setTimeout(compute, 30); }, Cesium.ScreenSpaceEventType.LEFT_UP);
  }
  // 앱의 기본 클릭(지점 카드)·측정과 충돌 방지: 가시권 지정 중에는 기본 클릭을 무시
  const _clickVS = handler.getInputAction(Cesium.ScreenSpaceEventType.LEFT_CLICK);
  handler.setInputAction(e=>{ if(VS.active && (VS.armed || VS.justDone)) { VS.justDone=false; return; } return _clickVS(e); }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
  function on(){ VS.active = true; ensureHandler(); if(!STATE.on.has('tiles')) toast('3D 모델이 꺼져 있습니다 · SITE › 3D 모델 › 3D Tiles를 켜고 현장 근처에서 사용하세요', 5000); arm(); }
  function off(){ VS.active = false; VS.armed = false; VS.dragging = false; scene.screenSpaceCameraController.enableInputs = true; if(VS.fp) restoreView(); clearResult(); setHud(null); if($('#vsH')) $('#card').classList.remove('open'); }
  L3.view = { on, off, src:()=> VS.active && VS.stats ? '<b>가시권</b> 깊이 버퍼 분석 (DERIVED)' : '' };
  window.sistechViewshed = VS;
})();

<script>

     cadSig   시군구 경계 + 이름            : WFS incheon:tl_scco_sig (11개)
     cadWms   연속지적도 WMS (지형용 영상)    : WMS incheon:por_lsmd_cont_ldreg · 지형 위 영상(3D 모델 아래는 가려짐) · 광역 확인용
   클릭: 필지 레이어가 켜져 있으면 지도 클릭 → 필지 카드(지번·지목·PNU·법정동·면적·둘레)
   출처: 인천광역시 지도포털 https://imap.incheon.go.kr (연속지적도는 임의 편집되어 측량용으로 사용할 수 없음)
*/
(function(){

    '제':['제방','#B3C6DE'], '천':['하천','#9AD0F5'], '구':['구거','#A5D6F8'], '유':['유지','#B7E3FB'], '양':['양어장','#C9F1F6'], '수':['수도용지','#D5F2FA'], '공':['공원','#B9E6C9'], '체':['체육용지','#C8F1D9'], '원':['유원지','#FFE0F0'],
    '종':['종교용지','#E7D3F3'], '사':['사적지','#F6E7CD'], '묘':['묘지','#E1E1C2'], '잡':['잡종지','#E9E9E9'] };
  const jimokOf = jb => { const m = (jb||'').match(/([가-힣])$/); return m ? m[1] : ''; };
  const EMD_NAME = new Map(); // emd_cd(8) → 이름

  /* ---- 메뉴: SITE › 지적 (지역 다음) ---- */
  const icon = '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3zM3 11h8M11 5v14M11 15h10M16 11v8"/></svg>';
  const cat = { id:'cadastre', name:'지적', icon, items:[
    { id:'cadLine',  q:'이 땅의 필지 경계와 지번은', name:'연속지적도 · 필지 경계·지번', src:'인천시 지도포털 WFS · 화면 범위 필지를 3D 모델·지형 위에 밀착 표시 · 지번 라벨(가까이) · 클릭하면 필지 카드 · 고도 1.5 km 이상은 WMS 영상', type:'layer' },
    { id:'cadJimok', q:'땅의 용도(지목)는', name:'지목별 색 (전·답·대·도로 등 28종)', src:'필지 지번 끝 글자(지목 부호) 기준 채움 · 범례 표시', type:'layer' },

  try{ renderCats(); renderSub(); }catch(e){}

  const inIncheon = (w,s,e,n) => !(e < INCHEON.w || w > INCHEON.e || n < INCHEON.s || s > INCHEON.n);
  async function wfs(type, bbox, count){ const u = BASE + 'wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=' + encodeURIComponent(type) + '&SRSNAME=EPSG:4326&OUTPUTFORMAT=application/json&COUNT=' + (count||5000) + (bbox? '&BBOX=' + bbox.join(',') + ',EPSG:4326' : ''); const r = await fetch(u); if(!r.ok) throw new Error('WFS '+r.status); return r.json(); }
  function rings(geom){ const out = []; if(!geom) return out; if(geom.type==='Polygon') out.push(...geom.coordinates); else if(geom.type==='MultiPolygon') for(const p of geom.coordinates) out.push(...p); return out; }
  function centroid(ring){ let a=0, cx=0, cy=0; for(let i=0;i<ring.length-1;i++){ const [x0,y0]=ring[i], [x1,y1]=ring[i+1]; const f = x0*y1 - x1*y0; a += f; cx += (x0+x1)*f; cy += (y0+y1)*f; } if(Math.abs(a)<1e-12){ return ring[0]; } a*=0.5; return [cx/(6*a), cy/(6*a)]; }
  function inRing(x, y, ring){ let inside=false; for(let i=0, j=ring.length-1; i<ring.length; j=i++){ const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
  function geoArea(ring){ const R=6371008.8; let s=0; for(let i=0;i<ring.length-1;i++){ const a=ring[i], b=ring[i+1]; s += (rad(b[0])-rad(a[0]))*(2+Math.sin(rad(a[1]))+Math.sin(rad(b[1]))); } return Math.abs(s*R*R/2); }
  function geoLen(ring){ let d=0; for(let i=1;i<ring.length;i++) d += new C.EllipsoidGeodesic(C.Cartographic.fromDegrees(ring[i-1][0], ring[i-1][1]), C.Cartographic.fromDegrees(ring[i][0], ring[i][1])).surfaceDistance; return d; }
  function groundAlt(){ const c = camera.positionCartographic; let g = 0; try{ g = globe.getHeight(c) || 0; }catch(e){} return Math.max(0, c.height - g); }
  function viewBox(){ const r = camera.computeViewRectangle(globe.ellipsoid); if(!r) return null; return [deg(r.west), deg(r.south), deg(r.east), deg(r.north)]; }
  const fmtArea = a => a>=1e6? (a/1e6).toFixed(2)+' ㎢' : Math.round(a).toLocaleString()+' ㎡ · '+(a/3.3058).toFixed(0)+' 평';

  /* ---- 1·2. 필지 (선·지번 / 지목 면) ---- */
  function clearParcels(){ if(CAD.lineP){ scene.groundPrimitives.remove(CAD.lineP); CAD.lineP=null; } if(CAD.fillP){ scene.groundPrimitives.remove(CAD.fillP); CAD.fillP=null; } if(CAD.labels){ scene.primitives.remove(CAD.labels); CAD.labels=null; } CAD.feats.clear(); CAD.lastKey=''; }
  function wantParcels(){ return STATE.on.has('cadLine') || STATE.on.has('cadJimok'); }
  async function refreshParcels(force){
    if(!wantParcels()) return;
    const alt = groundAlt(); const bb = viewBox(); if(!bb) return;
    if(alt > 1500){ // 광역: 벡터 대신 WMS 영상
      if(STATE.on.has('cadLine') && !CAD.wmsAuto){ CAD.wmsAuto = true; showWms(); toast('고도 1.5 km 이상 · 연속지적도를 WMS 영상으로 표시 (확대하면 필지 벡터·지번)', 2600); }
      if(CAD.lineP) CAD.lineP.show = false; if(CAD.fillP) CAD.fillP.show = false; if(CAD.labels) CAD.labels.show = false; return; }
    if(CAD.wmsAuto){ CAD.wmsAuto = false; if(!STATE.on.has('cadWms')) hideWms(); }
    if(CAD.lineP) CAD.lineP.show = STATE.on.has('cadLine'); if(CAD.fillP) CAD.fillP.show = STATE.on.has('cadJimok'); if(CAD.labels) CAD.labels.show = STATE.on.has('cadLine');
    if(!inIncheon(...bb)){ if(force) toast('인천광역시 밖에서는 지적도가 제공되지 않습니다 (인천시 지도포털 자료)', 3000); return; }
    // 화면 범위(여유 10%) · 너무 넓으면 중심 2 km 사각으로 제한
    let [w,s,e,n] = bb; const pw=(e-w)*0.1, ph=(n-s)*0.1; w-=pw; e+=pw; s-=ph; n+=ph;
    const cx=(w+e)/2, cy=(s+n)/2; const maxLon = 0.016, maxLat = 0.011; // 약 1.4 × 1.2 km if(e-w > maxLon){ w = cx-maxLon/2; e = cx+maxLon/2; } if(n-s > maxLat){ s = cy-maxLat/2; n = cy+maxLat/2; }
    const key = [w,s,e,n].map(v=>v.toFixed(4)).join(','); if(!force && key===CAD.lastKey) return; if(CAD.loading) { CAD.pending = true; return; }
    CAD.loading = true; CAD.lastKey = key;
    try{
      const j = await wfs('incheon:por_lsmd_cont_ldreg', [w,s,e,n], 5000);
      let added = 0; for(const f of j.features){ const pnu = f.properties.pnu || f.id; if(!CAD.feats.has(pnu)){ CAD.feats.set(pnu, f); added++; } }
      // 캐시 상한: 멀리 있는 필지 제거
      if(CAD.feats.size > 9000){ for(const [k,f] of CAD.feats){ const r0 = rings(f.geometry)[0]; if(!r0) continue; const c = r0[0]; if(c[0]<w-0.02||c[0]>e+0.02||c[1]<s-0.02||c[1]>n+0.02) CAD.feats.delete(k); if(CAD.feats.size <= 7000) break; } }
      rebuildParcels();
      if(j.features.length >= 5000) toast('필지가 5,000개를 넘어 일부만 표시됩니다 · 더 확대해 주세요', 3000);
    }catch(e){ toast('지적도 불러오기 실패: '+e.message, 3500); }
    CAD.loading = false; if(CAD.pending){ CAD.pending = false; refreshParcels(); }
  }
  function rebuildParcels(){
    if(CAD.lineP){ scene.groundPrimitives.remove(CAD.lineP); CAD.lineP=null; } if(CAD.fillP){ scene.groundPrimitives.remove(CAD.fillP); CAD.fillP=null; } if(CAD.labels){ scene.primitives.remove(CAD.labels); CAD.labels=null; }
    const lines = [], fills = []; const labels = new C.LabelCollection(); const labelReq = [];
    for(const [pnu, f] of CAD.feats){
      const rs = rings(f.geometry); if(!rs.length) continue; const jb = f.properties.jibun || ''; const jm = jimokOf(jb);
      for(const r of rs){ if(r.length < 4) continue; const pos = C.Cartesian3.fromDegreesArray(r.flat());
        lines.push(new C.GeometryInstance({ geometry: new C.GroundPolylineGeometry({ positions: pos, width: 1.6 }), attributes:{ color: C.ColorGeometryInstanceAttribute.fromColor(LINE_COL) }, id:'cad:'+pnu }));
        const col = JIMOK[jm] ? C.Color.fromCssColorString(JIMOK[jm][1]).withAlpha(.45) : C.Color.WHITE.withAlpha(.15);
        fills.push(new C.GeometryInstance({ geometry: new C.PolygonGeometry({ polygonHierarchy: new C.PolygonHierarchy(pos) }), attributes:{ color: C.ColorGeometryInstanceAttribute.fromColor(col) }, id:'cadf:'+pnu })); }
      const c = centroid(rs[0]); if(jb && labelReq.length < 3000) labelReq.push({ lon:c[0], lat:c[1], text: jb.replace(/[가-힣]$/, ''), pnu });
    }
    if(lines.length){ CAD.lineP = scene.groundPrimitives.add(new C.GroundPolylinePrimitive({ geometryInstances: lines, appearance: new C.PolylineColorAppearance(), classificationType: C.ClassificationType.BOTH, asynchronous: true })); CAD.lineP.show = STATE.on.has('cadLine'); }
    if(fills.length){ CAD.fillP = scene.groundPrimitives.add(new C.GroundPrimitive({ geometryInstances: fills, appearance: new C.PerInstanceColorAppearance({ flat: true }), classificationType: C.ClassificationType.BOTH, asynchronous: true })); CAD.fillP.show = STATE.on.has('cadJimok'); }
    CAD.labels = scene.primitives.add(labels); CAD.labels.show = STATE.on.has('cadLine');
    // 지번 라벨: 지형 높이를 비동기로 한 번에 샘플링(동기 globe.getHeight 반복 호출은 멈춤 유발) → 지면 +1.5 m
    const myLabels = labels; (async ()=>{ let hs = null; try{ hs = await C.sampleTerrain(globe.terrainProvider, 13, labelReq.map(r=>C.Cartographic.fromDegrees(r.lon, r.lat))); }catch(e){ hs = null; }
      if(CAD.labels !== myLabels) return; // 그 사이 다시 그려졌으면 폐기
      labelReq.forEach((r,i)=>{ const h = hs && hs[i] && isFinite(hs[i].height) ? hs[i].height : 0; myLabels.add({ position: C.Cartesian3.fromDegrees(r.lon, r.lat, h + 1.5), text: r.text, font: '11px Inter, "Noto Sans KR", sans-serif', fillColor: C.Color.WHITE, outlineColor: C.Color.fromCssColorString('#03122A'), outlineWidth: 3, style: C.LabelStyle.FILL_AND_OUTLINE, disableDepthTestDistance: Number.POSITIVE_INFINITY, distanceDisplayCondition: new C.DistanceDisplayCondition(0, 700), scale: 0.95, id:'cadl:'+r.pnu }); }); })();
    updateSrc();
  }
  let moveT = null; camera.moveEnd.addEventListener(()=>{ if(!wantParcels()) return; clearTimeout(moveT); moveT = setTimeout(()=>refreshParcels(false), 250); });

  /* ---- 범례 (지목) ---- */
  function showLegend(){ if(CAD.legendEl) return; const el = document.createElement('div'); el.id='cadLegend'; el.className='panel'; el.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:72px;z-index:21;padding:8px 12px;display:flex;flex-wrap:wrap;gap:4px 10px;max-width:min(92vw,760px);font-size:11px;color:var(--text)';
    el.innerHTML = '<b style="width:100%;font-size:12px;color:var(--lime-bright)">지목 범례 (지번 끝 글자 기준 · 인천시 연속지적도)</b>' + Object.entries(JIMOK).map(([k,v])=>`<span><i style="display:inline-block;width:11px;height:11px;border-radius:2px;background:${v[1]};vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.3)"></i>${v[0]}(${k})</span>`).join(''); document.body.appendChild(el); CAD.legendEl = el; }
  function hideLegend(){ if(CAD.legendEl){ CAD.legendEl.remove(); CAD.legendEl=null; } }

  /* ---- 3·4. 법정동·시군구 경계 ---- */
  async function loadAdmin(kind){ // kind: 'emd' | 'sig'
    const type = kind==='emd' ? 'incheon:tl_scco_emd' : 'incheon:tl_scco_sig'; const nameK = kind==='emd' ? 'emd_kor_nm' : 'sig_kor_nm'; const codeK = kind==='emd' ? 'emd_cd' : 'sig_cd';
    toast((kind==='emd'?'법정동':'시군구')+' 경계 불러오는 중 (인천시 지도포털) …', 2000);
    const j = await wfs(type, null, 2000); const col = kind==='emd' ? C.Color.fromCssColorString('#FFB454').withAlpha(.95) : C.Color.fromCssColorString('#FF5D5D').withAlpha(.95);
    const lines = []; const labels = new C.LabelCollection(); const labelReq = [];
    for(const f of j.features){ const rs = rings(f.geometry); const nm = f.properties[nameK]; if(kind==='emd' && f.properties[codeK]) EMD_NAME.set(String(f.properties[codeK]), nm);
      let best = null; for(const r of rs){ if(r.length<4) continue; lines.push(new C.GeometryInstance({ geometry: new C.GroundPolylineGeometry({ positions: C.Cartesian3.fromDegreesArray(r.flat()), width: kind==='emd'?2:3.5 }), attributes:{ color: C.ColorGeometryInstanceAttribute.fromColor(col) } })); const a = geoArea(r); if(!best || a>best.a) best = { a, r }; }
      if(best && nm){ const cc = centroid(best.r); labelReq.push({ lon: cc[0], lat: cc[1], text: nm }); } }
    (async ()=>{ let hs = null; try{ hs = await C.sampleTerrain(globe.terrainProvider, 11, labelReq.map(r=>C.Cartographic.fromDegrees(r.lon, r.lat))); }catch(e){ hs = null; }
      labelReq.forEach((r,i)=>{ const h = hs && hs[i] && isFinite(hs[i].height) ? hs[i].height : 0; labels.add({ position: C.Cartesian3.fromDegrees(r.lon, r.lat, h + 5), text: r.text, font: (kind==='emd'?'13px':'16px')+' Inter, "Noto Sans KR", sans-serif', fillColor: kind==='emd'? C.Color.fromCssColorString('#FFD9A8') : C.Color.fromCssColorString('#FFB3B3'), outlineColor: C.Color.fromCssColorString('#03122A'), outlineWidth: 4, style: C.LabelStyle.FILL_AND_OUTLINE, disableDepthTestDistance: Number.POSITIVE_INFINITY, distanceDisplayCondition: new C.DistanceDisplayCondition(0, kind==='emd'? 25000 : 120000) }); }); })();
    const P = scene.groundPrimitives.add(new C.GroundPolylinePrimitive({ geometryInstances: lines, appearance: new C.PolylineColorAppearance(), classificationType: C.ClassificationType.BOTH }));
    const Lc = scene.primitives.add(labels);
    CAD[kind] = { P, Lc, n: j.features.length };
    toast((kind==='emd'?'법정동 ':'시군구 ')+j.features.length+'개 경계 표시', 2000);
  }
  function unloadAdmin(kind){ const o = CAD[kind]; if(!o) return; scene.groundPrimitives.remove(o.P); scene.primitives.remove(o.Lc); CAD[kind] = null; }

  /* ---- 5. WMS 영상 ---- */
  function showWms(){ if(CAD.wmsL){ CAD.wmsL.show = true; return; } const prov = new C.WebMapServiceImageryProvider({ url: BASE + 'wms', layers: 'incheon:por_lsmd_cont_ldreg', parameters: { service:'WMS', version:'1.3.0', format:'image/png', transparent:true, styles:'' }, tilingScheme: new C.WebMercatorTilingScheme(), rectangle: C.Rectangle.fromDegrees(INCHEON.w, INCHEON.s, INCHEON.e, INCHEON.n), tileWidth: 512, tileHeight: 512, maximumLevel: 20, credit: new C.Credit('인천광역시 지도포털 연속지적도') });
    CAD.wmsL = viewer.imageryLayers.addImageryProvider(prov); CAD.wmsL.alpha = 0.9; }
  function hideWms(){ if(CAD.wmsL) CAD.wmsL.show = false; }

  /* ---- 레이어 등록 (자체 레지스트리 L6 + toggleLayer/updateSrc 체인) ---- */
  const L6 = {};
  L6.cadLine = { on: async ()=>{ await refreshParcels(true); if(!CAD.feats.size && groundAlt()<=2000) toast('화면 범위에 필지가 없거나 인천 밖입니다', 2500); }, off: ()=>{ if(CAD.lineP) CAD.lineP.show=false; if(CAD.labels) CAD.labels.show=false; if(CAD.wmsAuto){ CAD.wmsAuto=false; if(!STATE.on.has('cadWms')) hideWms(); } if(!wantParcels()) clearParcels(); closeCard(); },
    src: ()=> STATE.on.has('cadLine') ? '<b>인천시 지도포털</b> 연속지적도 '+(CAD.wmsAuto?'WMS':CAD.feats.size.toLocaleString()+'필지')+' (OFFICIAL · 측량용 불가)' : '' };
  L6.cadJimok = { on: async ()=>{ showLegend(); await refreshParcels(true); if(CAD.fillP) CAD.fillP.show = true; }, off: ()=>{ hideLegend(); if(CAD.fillP) CAD.fillP.show=false; if(!wantParcels()) clearParcels(); },
    src: ()=> STATE.on.has('cadJimok') ? '<b>지목</b> 지번 부호 기준 채움 (DERIVED)' : '' };
  L6.cadEmd = { on: ()=>loadAdmin('emd'), off: ()=>unloadAdmin('emd'), src: ()=> CAD.emd ? '<b>인천시</b> 법정동 '+CAD.emd.n+'개 (OFFICIAL)' : '' };
  L6.cadSig = { on: ()=>loadAdmin('sig'), off: ()=>unloadAdmin('sig'), src: ()=> CAD.sig ? '<b>인천시</b> 시군구 '+CAD.sig.n+'개 (OFFICIAL)' : '' };
  L6.cadWms = { on: ()=>showWms(), off: ()=>{ if(!CAD.wmsAuto) hideWms(); }, src: ()=> STATE.on.has('cadWms') ? '<b>인천시 지도포털</b> 연속지적도 WMS (OFFICIAL)' : '' };

  /* ---- 클릭: 필지 카드 ---- */
  const CARD = (title, sub, html) => { STATE.point = null; const c = document.getElementById('card'); c.classList.add('open'); document.getElementById('cardTitle').innerHTML = title + '<small>' + (sub||'') + '</small>'; document.getElementById('cardBody').innerHTML = html; };
  function closeCard(){ if(CAD.picked){ viewer.entities.remove(CAD.picked); CAD.picked = null; } }
  function pickLL(pos){ let c = null; const pk = scene.pick(pos); if(C.defined(pk) && scene.pickPositionSupported) c = scene.pickPosition(pos); if(!c){ const ray = camera.getPickRay(pos); c = ray && globe.pick(ray, scene); } if(!c) c = camera.pickEllipsoid(pos, globe.ellipsoid); if(!c) return null; const ct = C.Cartographic.fromCartesian(c); return [deg(ct.longitude), deg(ct.latitude)]; }
  const _cadClick = handler.getInputAction(C.ScreenSpaceEventType.LEFT_CLICK);
  handler.setInputAction(e=>{
    if(!wantParcels() || STATE.measure || CAD.wmsAuto || (window.__GT && window.__GT.picking)) return _cadClick && _cadClick(e);
    const ll = pickLL(e.position); if(!ll) return _cadClick && _cadClick(e);
    let hit = null, hitRing = null; for(const [pnu, f] of CAD.feats){ for(const r of rings(f.geometry)){ if(inRing(ll[0], ll[1], r)){ hit = f; hitRing = r; break; } } if(hit) break; }
    if(!hit) return _cadClick && _cadClick(e);
    const p = hit.properties; const jb = p.jibun||''; const jm = jimokOf(jb); const pnu = String(p.pnu||''); const emdCd = pnu.slice(0,8); const emdNm = EMD_NAME.get(emdCd) || ''; const san = pnu.charAt(10)==='2' ? '산 ' : '';
    const area = rings(hit.geometry).reduce((s,r)=>s+geoArea(r),0); const per = geoLen(hitRing);
    closeCard(); CAD.picked = viewer.entities.add({ polyline:{ positions: C.Cartesian3.fromDegreesArray(hitRing.flat()), width: 4, clampToGround: true, classificationType: C.ClassificationType.BOTH, material: LIME } });
    const sigNm = { '28110':'중구','28125':'제물포구','28140':'동구','28155':'영종구','28177':'미추홀구','28185':'연수구','28200':'남동구','28237':'부평구','28245':'계양구','28260':'서구','28275':'서해구','28290':'검단구','28710':'강화군','28720':'옹진군' }[pnu.slice(0,5)] || '';
    CARD(`${san}${jb.replace(/[가-힣]$/, '')}${jm?' <small style="display:inline;font-size:13px;color:var(--lime-bright)">'+(JIMOK[jm]?JIMOK[jm][0]:jm)+'</small>':''}`, `인천광역시 ${sigNm} ${emdNm}`.trim()+' · 연속지적도 필지', `<div class="sec">
      <div class="kv"><div>지번<b>${san}${jb.replace(/[가-힣]$/, '')||'-'}</b></div><div>지목<b>${JIMOK[jm]?JIMOK[jm][0]+' ('+jm+')':(jm||'-')}</b></div><div>면적 (도형 계산)<b>${fmtArea(area)}</b></div><div>둘레<b>${Math.round(per).toLocaleString()} m</b></div><div>PNU<b style="font-size:12px;letter-spacing:.02em">${pnu||'-'}</b></div><div>법정동 코드<b>${emdCd||'-'}</b></div></div>
      <div class="meta"><span class="tag obs">OFFICIAL</span> 인천광역시 지도포털 연속지적도 (WFS) · 면적·둘레는 도형에서 계산한 참고값 · 연속지적도는 임의 편집되어 측량용으로 사용할 수 없습니다</div>
      <a class="cta ghost" href="https://imap.incheon.go.kr/sgp/bas/main.do" target="_blank" rel="noopener">인천시 지도포털 열기 ↗</a></div>`);
  }, C.ScreenSpaceEventType.LEFT_CLICK);
  const _cardClose = document.getElementById('cardClose'); if(_cardClose){ _cardClose.addEventListener('click', closeCard); }
  // 법정동 이름 표를 미리 (가볍게) 준비: 필지 카드용
  async function preloadEmdNames(){ if(EMD_NAME.size) return; try{ const r = await fetch(BASE + 'wfs?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=incheon:tl_scco_emd&OUTPUTFORMAT=application/json&COUNT=1000&PROPERTYNAME=emd_cd,emd_kor_nm'); const j = await r.json(); for(const f of j.features) if(f.properties.emd_cd) EMD_NAME.set(String(f.properties.emd_cd), f.properties.emd_kor_nm); }catch(e){} }
  const _lineOn = L6.cadLine.on; L6.cadLine.on = async ()=>{ preloadEmdNames(); return _lineOn(); };
  const _toggle6 = toggleLayer;
  toggleLayer = async function(id, force){
    if(!L6[id]) return _toggle6(id, force);
    const want = force!==undefined ? force : !STATE.on.has(id);
    if(want) STATE.on.add(id); else STATE.on.delete(id);
    try{ if(want) await L6[id].on(); else L6[id].off(); }catch(e){ toast('레이어 오류: '+e.message, 4000); STATE.on.delete(id); }
    renderCats(); renderSub(); updateSrc();
  };
  const _updateSrc6 = updateSrc;
  updateSrc = function(){ _updateSrc6(); const extra=[]; for(const id of STATE.on){ const s = L6[id]?.src; if(!s) continue; const v = typeof s==='function'? s():s; if(v) extra.push(v); } if(extra.length){ const el = $('#hudSrc'); if(el) el.innerHTML = el.innerHTML.replace('지형 없음', extra.join(' · ')+' · 지형 없음').replace('<b>Esri World Elevation</b> 지형', extra.join(' · ')+' · <b>Esri World Elevation</b> 지형'); } };
  // 초기 복원 (주소 해시에 켜진 상태로 저장된 경우)
  for(const id of Object.keys(L6)) if(STATE.on.has(id)) { try{ L6[id].on(); }catch(e){} }
  // EARTH 전환 등 전체 닫기 시 필지 카드 하이라이트 제거
  try{ const _cap2 = closeAllPanels; closeAllPanels = function(){ _cap2.apply(this, arguments); closeCard(); }; }catch(e){}
  window.__CAD = CAD; CAD.fn = { refreshParcels, rebuildParcels, loadAdmin, showWms, hideWms };
})();
</script>

<script>
/* ---------- 49. SITE › 분석 › 건물 속성 조회 (2026-10-09) ----------
   - 켜고 건물(3D 모델·지도)을 클릭 → 브이월드 건축물정보 LT_C_BLDGINFO(전국, 건축물대장 기반) + 연속지적 LP_PA_CBND_BUBUN(지번·PNU·공시지가) + 주소 API(도로명) 병렬 조회 (JSONP · 키 도메인 signspark.github.io)
   - 같은 지점 대장이 여러 건이면 연면적 큰 레코드를 대표로, 빈 값은 다른 레코드에서 보충 (예: 인천시청 = 총괄 + "본관" 빈 레코드)
   - 건물 외곽선을 3D 모델·지형 위에 노란색으로 덧칠(classification) + 외곽선 · 지붕 위 이름 라벨
   - 높이: 대장 높이가 0이면 3D 모델에서 실측 (외곽선 안 지붕 95% 분위 - 외곽선 밖 4 m 지면 25% 분위, scene.sampleHeight)
   - 카드: 주용도·구조·층수·높이·면적·건폐율·용적률·사용승인일 / 필지 지번·지목·PNU·공시지가 / GeoJSON·CSV 내보내기 · 위에서 보기
   - 분석 단일 활성(19·41) · 모드 전환 정리(46) · 측정/정사영상 구역 선택 중에는 양보 · 결과 캐시
   - 자료는 참고용 (측량·법적 효력 없음)
*/
(function(){
  const C = Cesium;
  const VW_KEY = '57C7018D-1A36-4873-99CD-A2272BD3040E';
  const VW_DOMAIN = 'https://signspark.github.io';
  const BD = { on:false, seq:0, ents:[], sel:null, cache:new Map(), cardOpen:false };
  const deg = r=>r*180/Math.PI, rad = d=>d*Math.PI/180;
  const YEL = C.Color.fromCssColorString('#FFD400');
  const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  /* ---- 메뉴: 분석 맨 위 ---- */
  const an = MENUS.site.find(c=>c.id==='analysis');
  if(an && !an.items.some(i=>i.id==='bldg')) an.items.unshift({ id:'bldg', q:'이 건물은 무엇이고 몇 층인가', name:'건물 속성 조회', src:'건물을 클릭 → 건축물대장(브이월드, 전국) 용도·구조·층수·면적·준공 · 필지·공시지가·도로명주소 · 3D 모델 실측 높이 · 외곽선 하이라이트 · GeoJSON/CSV', type:'layer' });
  try{ renderCats(); renderSub(); }catch(e){}

  /* ---- 코드표 ---- */
  const USE = { '01000':'단독주택','01001':'단독주택','01002':'다중주택','01003':'다가구주택','01004':'공관',
    '02000':'공동주택','02001':'아파트','02002':'연립주택','02003':'다세대주택','02004':'기숙사',
    '03000':'제1종 근린생활시설','04000':'제2종 근린생활시설','05000':'문화 및 집회시설','06000':'종교시설','07000':'판매시설','08000':'운수시설',
    '09000':'의료시설','10000':'교육연구시설','11000':'노유자시설','12000':'수련시설','13000':'운동시설','14000':'업무시설','14100':'공공업무시설','14200':'일반업무시설',
    '15000':'숙박시설','16000':'위락시설','17000':'공장','18000':'창고시설','19000':'위험물 저장·처리시설','20000':'자동차 관련시설','21000':'동물·식물 관련시설',
    '22000':'자원순환 관련시설','23000':'교정 및 군사시설','24000':'방송통신시설','25000':'발전시설','26000':'묘지 관련시설','27000':'관광 휴게시설','28000':'장례시설','29000':'야영장시설','30000':'가설건축물' };
  const STR = { '10':'조적구조','11':'벽돌구조','12':'블록구조','13':'석구조','19':'기타조적구조',
    '20':'콘크리트구조','21':'철근콘크리트구조','22':'프리캐스트콘크리트구조','26':'철골철근콘크리트구조','29':'기타콘크리트구조',
    '30':'철골구조','31':'일반철골구조','32':'경량철골구조','33':'강파이프구조','39':'기타강구조',
    '40':'목구조','41':'일반목구조','42':'통나무구조','49':'기타목구조','50':'기타구조','51':'기타구조' };
  const useName = c => { c = String(c||'').trim(); if(!c) return ''; if(USE[c]) return USE[c]; const g = c.slice(0,2)+'000'; return USE[g] ? USE[g]+' ('+c+')' : '코드 '+c; };
  const strName = c => { c = String(c||'').trim(); if(!c) return ''; return STR[c] || STR[c.slice(0,1)+'0'] || '코드 '+c; };
  const JIMOK = { '전':'전','답':'답','과':'과수원','목':'목장용지','임':'임야','광':'광천지','염':'염전','대':'대','장':'공장용지','학':'학교용지','차':'주차장','주':'주유소용지','창':'창고용지','도':'도로','철':'철도용지','제':'제방','천':'하천','구':'구거','유':'유지','양':'양어장','수':'수도용지','공':'공원','체':'체육용지','원':'유원지','종':'종교용지','사':'사적지','묘':'묘지','잡':'잡종지' };

  /* ---- 브이월드 JSONP ---- */
  function jsonp(url, ms){
    return new Promise((res, rej) => {
      const cb = '__vw49_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const s = document.createElement('script'); let done = false;
      const fin = () => { done = true; clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
      const t = setTimeout(()=>{ if(!done){ fin(); window[cb] = ()=>{}; rej(new Error('응답 시간 초과')); } }, ms||9000);
      window[cb] = d => { if(done) return; fin(); res(d); };
      s.onerror = () => { if(done) return; fin(); rej(new Error('네트워크 오류')); };
      s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
      document.head.appendChild(s);
    });
  }
  async function cached(key, fn){ if(BD.cache.has(key)) return BD.cache.get(key); const p = fn(); BD.cache.set(key, p); p.catch(()=>BD.cache.delete(key)); if(BD.cache.size > 400){ BD.cache.delete(BD.cache.keys().next().value); } return p; }
  const pt = (lon,lat) => lon.toFixed(7)+' '+lat.toFixed(7);
  function vwData(layer, lon, lat){
    return cached(layer+':'+lon.toFixed(6)+','+lat.toFixed(6), async ()=>{
      const d = await jsonp('https://api.vworld.kr/req/data?service=data&request=GetFeature&data='+layer+'&key='+VW_KEY+'&domain='+encodeURIComponent(VW_DOMAIN)+'&geomFilter=POINT('+encodeURIComponent(pt(lon,lat))+')&geometry=true&crs=EPSG:4326&format=json&size=20');
      const r = d && d.response; if(!r) throw new Error('응답 없음');
      if(r.status==='NOT_FOUND') return [];
      if(r.status!=='OK') throw new Error((r.error && (r.error.text||r.error.code)) || r.status);
      return (r.result && r.result.featureCollection && r.result.featureCollection.features) || [];
    });
  }
  function vwAddr(lon, lat){
    return cached('addr:'+lon.toFixed(5)+','+lat.toFixed(5), async ()=>{
      const d = await jsonp('https://api.vworld.kr/req/address?service=address&request=getAddress&version=2.0&crs=epsg:4326&point='+lon.toFixed(7)+','+lat.toFixed(7)+'&format=json&type=both&zipcode=true&simple=false&key='+VW_KEY);
      const r = d && d.response; if(!r || r.status!=='OK') return {};
      const o = {}; for(const x of (r.result||[])){ o[x.type] = x; } return o;
    });
  }

  /* ---- 레코드 병합 ---- */
  const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
  const filled = p => ['usability','archarea','totalarea','platarea','useapr_day','strct_cd','grnd_flr','height'].filter(k=>{ const v=p[k]; return v!==undefined && v!=='' && v!=='0' && v!==0; }).length;
  function merge(feats){
    if(!feats.length) return null;
    const sorted = feats.slice().sort((a,b)=> (num(b.properties.totalarea)-num(a.properties.totalarea)) || (filled(b.properties)-filled(a.properties)));
    const main = sorted[0]; const P = Object.assign({}, main.properties);
    for(const f of sorted.slice(1)){ const q = f.properties; for(const k in q){ const v = P[k]; if((v===undefined || v==='' || v==='0' || v===0) && q[k]!=='' && q[k]!=='0') P[k] = q[k]; } }
    const names = [...new Set(sorted.map(f=>f.properties.bld_nm).filter(Boolean))];
    const dongs = [...new Set(sorted.map(f=>f.properties.dong_nm).filter(Boolean))];
    let geom = main.geometry; if(!geom){ const g = sorted.find(f=>f.geometry); geom = g && g.geometry; }
    return { P, names, dongs, geom, n: feats.length, ids: sorted.map(f=>f.id) };
  }
  function ringsOf(geom){ const out=[]; if(!geom) return out; if(geom.type==='Polygon') out.push(geom.coordinates[0]); else if(geom.type==='MultiPolygon') for(const p of geom.coordinates) out.push(p[0]); return out.filter(r=>r && r.length>=4); }
  function inRing(x, y, ring){ let inside=false; for(let i=0, j=ring.length-1; i<ring.length; j=i++){ const xi=ring[i][0], yi=ring[i][1], xj=ring[j][0], yj=ring[j][1]; if(((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) inside=!inside; } return inside; }
  function geoArea(ring){ const R=6371008.8; let s=0; for(let i=0;i<ring.length-1;i++){ const a=ring[i], b=ring[i+1]; s += (rad(b[0])-rad(a[0]))*(2+Math.sin(rad(a[1]))+Math.sin(rad(b[1]))); } return Math.abs(s*R*R/2); }
  function centroid(ring){ let a=0, cx=0, cy=0; for(let i=0;i<ring.length-1;i++){ const [x0,y0]=ring[i], [x1,y1]=ring[i+1]; const f = x0*y1 - x1*y0; a += f; cx += (x0+x1)*f; cy += (y0+y1)*f; } if(Math.abs(a)<1e-14) return ring[0]; a*=0.5; return [cx/(6*a), cy/(6*a)]; }

  /* ---- 3D 모델 실측 높이 ---- */
  function q(arr, p){ if(!arr.length) return null; const s = arr.slice().sort((a,b)=>a-b); const i = Math.min(s.length-1, Math.max(0, Math.round((s.length-1)*p))); return s[i]; }
  function samplePts(rings){
    const ring = rings.slice().sort((a,b)=>geoArea(b)-geoArea(a))[0];
    let w=180,s=90,e=-180,n=-90; for(const [x,y] of ring){ if(x<w)w=x; if(x>e)e=x; if(y<s)s=y; if(y>n)n=y; }
    const ins = []; const N = 6;
    for(let i=0;i<N;i++) for(let j=0;j<N;j++){ const x = w+(e-w)*(i+.5)/N, y = s+(n-s)*(j+.5)/N; if(inRing(x,y,ring)) ins.push([x,y]); }
    const c = centroid(ring); if(inRing(c[0],c[1],ring)) ins.push(c);
    const outs = []; const mLat = 111320, mLon = 111320*Math.cos(rad(c[1]));
    // 외곽선 둘레를 따라 약 20점: 각 변의 바깥쪽 법선 방향 4 m (안쪽이면 반대편)
    let per = 0; for(let i=0;i<ring.length-1;i++) per += Math.hypot((ring[i+1][0]-ring[i][0])*mLon, (ring[i+1][1]-ring[i][1])*mLat);
    const gap = Math.max(3, per/20);
    outer: for(let i=0;i<ring.length-1;i++){ const a = ring[i], b = ring[i+1]; const ex_=(b[0]-a[0])*mLon, ey_=(b[1]-a[1])*mLat; const L = Math.hypot(ex_,ey_); if(L < 0.5) continue; const nx = ey_/L, ny = -ex_/L; const k = Math.max(1, Math.round(L/gap));
      for(let j=0;j<k;j++){ const t = (j+.5)/k; const px = a[0]+(b[0]-a[0])*t, py = a[1]+(b[1]-a[1])*t; let x = px + nx*4/mLon, y = py + ny*4/mLat; if(inRing(x,y,ring)){ x = px - nx*4/mLon; y = py - ny*4/mLat; if(inRing(x,y,ring)) continue; } outs.push([x,y]); if(outs.length >= 28) break outer; } }
    return { ins, outs };
  }
  function evalHeights(hIn, hOut){
    const ins = hIn.filter(h=>h!=null && isFinite(h)), outs = hOut.filter(h=>h!=null && isFinite(h));
    if(ins.length < 2 || outs.length < 2) return { ok:false, why:'3D 모델 높이를 읽지 못함', nIn:ins.length, nOut:outs.length };
    const roof = q(ins, .95), ground = q(outs, .25); const H = roof - ground;
    if(!(H > 1.5) || H > 700) return { ok:false, why:'3D 모델 범위 밖이거나 지면과 구분 안 됨', roof, ground, nIn:ins.length, nOut:outs.length };
    return { ok:true, H, roof, ground, nIn:ins.length, nOut:outs.length };
  }
  // 비동기(타일 최상세 로드 후 샘플링 · 화면 밖 건물도 가능 · 화면 멈춤 없음) → 실패/8초 초과 시 동기 샘플(점 수 축소)로 대체
  async function measureHeight(rings){
    if(!scene.sampleHeightSupported) return { ok:false, why:'이 브라우저는 높이 샘플링 미지원' };
    const { ins, outs } = samplePts(rings); const ex = BD.ents.slice();
    const all = ins.concat(outs).map(([x,y])=>C.Cartographic.fromDegrees(x,y));
    try{
      const r = await Promise.race([ scene.sampleHeightMostDetailed(all, ex), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 8000)) ]);
      const hs = r.map(c=>c && c.height); const res = evalHeights(hs.slice(0, ins.length), hs.slice(ins.length)); res.mode = 'async'; return res;
    }catch(e){
      const sh = (x,y) => { try{ const h = scene.sampleHeight(C.Cartographic.fromDegrees(x,y), ex); return (h!==undefined && isFinite(h)) ? h : null; }catch(err){ return null; } };
      const pick = (arr, n) => arr.filter((_,i)=> i % Math.max(1, Math.ceil(arr.length/n)) === 0);
      const res = evalHeights(pick(ins,12).map(p=>sh(...p)), pick(outs,10).map(p=>sh(...p))); res.mode = 'sync'; return res;
    }
  }

  /* ---- 하이라이트 ---- */
  function clearHL(){ for(const e of BD.ents) try{ viewer.entities.remove(e); }catch(err){} BD.ents = []; }
  function drawHL(rings){
    clearHL();
    for(const r of rings){
      const pos = C.Cartesian3.fromDegreesArray(r.flat());
      BD.ents.push(viewer.entities.add({ polygon:{ hierarchy: new C.PolygonHierarchy(pos), material: YEL.withAlpha(.38), classificationType: C.ClassificationType.BOTH } }));
      BD.ents.push(viewer.entities.add({ polyline:{ positions: pos, width: 3.5, clampToGround: true, classificationType: C.ClassificationType.BOTH, material: YEL } }));
    }
    for(const e of BD.ents) e._bd49 = true;
  }
  function addLabel(lon, lat, h, text){ const e = viewer.entities.add({ position: C.Cartesian3.fromDegrees(lon, lat, h), label:{ text, font:'600 13px Inter, "Noto Sans KR", sans-serif', fillColor: C.Color.WHITE, outlineColor: C.Color.fromCssColorString('#03122A'), outlineWidth: 4, style: C.LabelStyle.FILL_AND_OUTLINE, verticalOrigin: C.VerticalOrigin.BOTTOM, pixelOffset: new C.Cartesian2(0,-6), disableDepthTestDistance: Number.POSITIVE_INFINITY, showBackground: true, backgroundColor: C.Color.fromCssColorString('#03122A').withAlpha(.65), backgroundPadding: new C.Cartesian2(7,4) } }); e._bd49 = true; BD.ents.push(e); }

  /* ---- 카드 ---- */
  function CARD(title, sub, html){ STATE.point = null; const c = document.getElementById('card'); c.classList.add('open'); document.getElementById('cardTitle').innerHTML = title + '<small>' + (sub||'') + '</small>'; document.getElementById('cardBody').innerHTML = html; BD.cardOpen = true; }
  const m2 = v => { const n = num(v); return n>0 ? n.toLocaleString(undefined,{maximumFractionDigits:2})+' ㎡ <span style="color:var(--text-dim);font-weight:400">('+(n/3.3058).toLocaleString(undefined,{maximumFractionDigits:0})+'평)</span>' : '-'; };
  const pct = v => { const n = num(v); return n>0 ? n.toFixed(2)+' %' : '-'; };
  const ymd = v => { v = String(v||''); if(!/^\d{8}$/.test(v)) return '-'; const y=+v.slice(0,4); const age = new Date().getFullYear()-y; return v.slice(0,4)+'-'+v.slice(4,6)+'-'+v.slice(6,8)+' <span style="color:var(--text-dim);font-weight:400">('+age+'년)</span>'; };
  const kv = (k, v) => `<div>${k}<b>${v}</b></div>`;
  function heightHtml(S){
    const reg = num(S.B && S.B.P.height); const parts = [];
    if(reg > 0) parts.push(reg.toFixed(1)+' m <span style="color:var(--text-dim);font-weight:400">(대장)</span>');
    if(S.mh === undefined) parts.push('<span style="color:var(--text-dim);font-weight:400">3D 모델 실측 중…</span>');
    else if(S.mh && S.mh.ok){ const f = num(S.B && S.B.P.grnd_flr); parts.push(S.mh.H.toFixed(1)+' m <span style="color:var(--text-dim);font-weight:400">(3D 실측'+(f>0?' · 층당 '+(S.mh.H/f).toFixed(1)+' m':'')+')</span>'); }
    else if(!reg) parts.push('<span style="color:var(--text-dim);font-weight:400">- ('+esc(S.mh ? S.mh.why : '실측 불가')+')</span>');
    return parts.join('<br>') || '-';
  }
  function render(S){
    const B = S.B, Pc = S.parcel, A = S.addr || {};
    const road = A.road ? A.road.text : '', jibunAddr = (Pc && Pc.addr) || (A.parcel ? A.parcel.text : '');
    let title, sub;
    if(B){ title = esc(B.names[0] || (A.road && A.road.structure && A.road.structure.detail) || '이름 없는 건물') + (B.dongs.length? ' <small style="display:inline;font-size:13px;color:var(--lime-bright)">'+esc(B.dongs.join('·'))+'</small>' : ''); sub = esc(road || jibunAddr || (S.lat.toFixed(5)+', '+S.lon.toFixed(5))); }
    else { title = '건축물 정보 없음'; sub = esc(road || jibunAddr || (S.lat.toFixed(5)+', '+S.lon.toFixed(5))); }
    let html = '';
    if(B){ const P = B.P;
      const cells = [ ['주용도', esc(useName(P.usability))], ['구조', esc(strName(P.strct_cd))], ['층수', (num(P.grnd_flr)||num(P.ugrnd_flr)) ? '지상 '+num(P.grnd_flr)+' / 지하 '+num(P.ugrnd_flr) : ''],
        ['건축면적', num(P.archarea)>0 ? m2(P.archarea) : ''], ['연면적', num(P.totalarea)>0 ? m2(P.totalarea) : ''], ['대지면적', num(P.platarea)>0 ? m2(P.platarea) : ''],
        ['사용승인일', /^\d{8}$/.test(String(P.useapr_day||'')) ? ymd(P.useapr_day) : ''], ['건폐율', num(P.bc_rat)>0 ? pct(P.bc_rat) : ''], ['용적률', num(P.vl_rat)>0 ? pct(P.vl_rat) : ''] ];
      const shown = cells.filter(c=>c[1]); const missing = cells.filter(c=>!c[1]).map(c=>c[0]);
      html += `<div class="sec"><div class="kv">${shown.slice(0,3).map(c=>kv(c[0],c[1])).join('')}<div id="bd49h">높이<b>${heightHtml(S)}</b></div>${shown.slice(3).map(c=>kv(c[0],c[1])).join('')}</div>

    }

      html += `<div class="sec"><h3 style="margin:0 0 6px;font-size:13px;color:var(--lime-bright)">필지</h3><div class="kv">

      ${B && B.geom ? '<button class="cta ghost" data-bd="top" style="flex:1">위에서 보기</button><button class="cta ghost" data-bd="geojson" style="flex:1">GeoJSON</button>' : ''}
      <button class="cta ghost" data-bd="csv" style="flex:1">CSV</button>
      <a class="cta ghost" href="https://www.eais.go.kr/" target="_blank" rel="noopener" style="flex:1;text-align:center">세움터 ↗</a></div>
      <div class="sec"><div class="meta">건축물대장·연속지적 자료는 참고용입니다 (측량·법적 효력 없음). 3D 실측 높이는 드론 메시 표면 기준 추정값입니다.</div></div>`;
    CARD(title, sub, html);
    const body = document.getElementById('cardBody');

  }
  function updateHeightCell(S){ const el = document.getElementById('bd49h'); if(el && BD.sel===S) el.innerHTML = '높이<b>'+heightHtml(S)+'</b>'; }

  /* ---- 내보내기 ---- */
  function dl(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  function rowOf(S){ const P = (S.B && S.B.P) || {}; const Pc = S.parcel || {}; const A = S.addr || {};
    return { 건물명: (S.B && S.B.names.join(' / ')) || '', 동명: (S.B && S.B.dongs.join(' / ')) || '', 도로명주소: A.road ? A.road.text : '', 지번주소: Pc.addr || (A.parcel ? A.parcel.text : ''), PNU: Pc.pnu || '',
      주용도: useName(P.usability), 용도코드: P.usability || '', 구조: strName(P.strct_cd), 구조코드: P.strct_cd || '', 지상층수: P.grnd_flr || '', 지하층수: P.ugrnd_flr || '',
      대장높이_m: num(P.height) || '', 실측높이_m: S.mh && S.mh.ok ? +S.mh.H.toFixed(2) : '', 건축면적_m2: P.archarea || '', 연면적_m2: P.totalarea || '', 대지면적_m2: P.platarea || '',
      건폐율_pct: P.bc_rat || '', 용적률_pct: P.vl_rat || '', 사용승인일: P.useapr_day || '', 공시지가_원m2: Pc.jiga || '', 공시기준: Pc.gosi_year ? Pc.gosi_year+'-'+Pc.gosi_month : '',
      클릭_경도: +S.lon.toFixed(7), 클릭_위도: +S.lat.toFixed(7), 출처: '브이월드 LT_C_BLDGINFO · LP_PA_CBND_BUBUN · 주소API (참고용)', 조회시각: new Date().toISOString() }; }
  function fileBase(S){ const nm = ((S.B && S.B.names[0]) || 'building').replace(/[\\/:*?"<>|\s]+/g,'_'); const d = new Date(); return '건물_'+nm+'_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0'); }
  function action(kind, S){
    if(kind==='top'){ const rs = ringsOf(S.B.geom); const all = rs.flat(); const bs = C.BoundingSphere.fromPoints(all.map(([x,y])=>C.Cartesian3.fromDegrees(x,y,(S.mh&&S.mh.ok)?S.mh.roof:0))); camera.flyToBoundingSphere(bs, { offset: new C.HeadingPitchRange(camera.heading, rad(-89.9), Math.max(80, bs.radius*3.2)), duration: 1.4 }); return; }
    const row = rowOf(S);
    if(kind==='geojson'){ const fc = { type:'FeatureCollection', name: fileBase(S), crs:{ type:'name', properties:{ name:'urn:ogc:def:crs:OGC:1.3:CRS84' } }, features:[{ type:'Feature', properties: row, geometry: S.B.geom }] }; dl(fileBase(S)+'.geojson', new Blob([JSON.stringify(fc, null, 1)], { type:'application/geo+json' })); toast('GeoJSON 저장: '+fileBase(S)+'.geojson', 2200); return; }
    if(kind==='csv'){ const keys = Object.keys(row); const cell = v => { v = String(v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }; const txt = '\ufeff' + keys.map(cell).join(',') + '\r\n' + keys.map(k=>cell(row[k])).join(',') + '\r\n'; dl(fileBase(S)+'.csv', new Blob([txt], { type:'text/csv;charset=utf-8' })); toast('CSV 저장: '+fileBase(S)+'.csv', 2200); return; }
  }

  /* ---- 클릭 → 조회 ---- */
  function pickLL(pos){ let c = null; const pk = scene.pick(pos); if(C.defined(pk) && scene.pickPositionSupported) c = scene.pickPosition(pos); if(!c){ const ray = camera.getPickRay(pos); c = ray && globe.pick(ray, scene); } if(!c) c = camera.pickEllipsoid(pos, globe.ellipsoid); if(!c) return null; const ct = C.Cartographic.fromCartesian(c); return [deg(ct.longitude), deg(ct.latitude)]; }
  async function query(lon, lat){
    const my = ++BD.seq;
    CARD('건물 조회 중…', lat.toFixed(5)+', '+lon.toFixed(5), '<div class="sec"><p class="lead" style="color:var(--text-dim)">브이월드 건축물정보·필지·주소를 조회하고 있습니다…</p></div>');
    const [bR, pR, aR] = await Promise.allSettled([ vwData('LT_C_BLDGINFO', lon, lat), vwData('LP_PA_CBND_BUBUN', lon, lat), vwAddr(lon, lat) ]);
    if(my !== BD.seq || !BD.on) return;
    if(bR.status==='rejected' && pR.status==='rejected'){ clearHL(); CARD('조회 실패', lat.toFixed(5)+', '+lon.toFixed(5), '<div class="sec"><p class="lead"><span class="warn">브이월드 응답 오류: '+esc(bR.reason && bR.reason.message)+'</span></p><div class="meta">잠시 후 다시 클릭해 주세요 (일일 호출 한도 또는 네트워크 문제일 수 있음)</div></div>'); return; }
    const B = bR.status==='fulfilled' ? merge(bR.value) : null;
    const parcel = pR.status==='fulfilled' && pR.value[0] ? pR.value[0].properties : null;
    const S = { lon, lat, B, parcel, addr: aR.status==='fulfilled' ? aR.value : {}, mh: undefined, fpArea: 0 };
    BD.sel = S;
    const rs = B ? ringsOf(B.geom) : [];

    clearHL();
    render(S);
    if(rs.length){
      drawHL(rs);
      const P = B.P; const fl = num(P.grnd_flr);
      const c = centroid(rs.slice().sort((a,b)=>geoArea(b)-geoArea(a))[0]);
      measureHeight(rs).then(mh => {

        S.mh = mh;
        const g0 = (mh && mh.ground!=null) ? mh.ground : (globe.getHeight(C.Cartographic.fromDegrees(c[0],c[1]))||0);

    } else { S.mh = null; window.__BD49.last = S; if(!B) toast('이 지점에는 건축물 정보가 없습니다 · 필지 정보만 표시', 2200); }
  }

  const _bdClick = handler.getInputAction(C.ScreenSpaceEventType.LEFT_CLICK);
  handler.setInputAction(e => {
    if(!BD.on || STATE.mode!=='site' || otherBusy()) return _bdClick && _bdClick(e);

  function on(){ BD.on = true; viewer.canvas.style.cursor = 'crosshair'; toast('건물 속성 조회 켜짐 · 건물을 클릭하세요 (전국 건축물대장 · 3D 모델 위에서는 실측 높이)', 3000); }
  function off(){ BD.on = false; BD.seq++; clearHL(); if(viewer.canvas.style.cursor==='crosshair') viewer.canvas.style.cursor = ''; if(BD.cardOpen){ document.getElementById('card').classList.remove('open'); BD.cardOpen = false; } BD.sel = null; }
  const _t49 = toggleLayer;
  toggleLayer = async function(id, force){
    if(id === 'bldg'){
      const want = force!==undefined ? force : !STATE.on.has('bldg');
      if(want && STATE.mode!=='site'){ toast('건물 속성 조회는 SITE 모드에서 사용합니다', 2000); return; }
      if(want){ const others = an ? an.items.filter(x=>x.id!=='bldg' && x.id!=='re' && x.id!=='jeonse' && STATE.on.has(x.id)) : []; for(const o of others){ try{ await _t49(o.id, false); }catch(e){} } if(others.length) try{ toast('이전 분석 닫힘: '+others.map(o=>(o.name||o.id).replace(/\s*\(.*$/,'')).join(', '), 1800); }catch(e){} }

    }

  };

  updateSrc = function(){ _us49.apply(this, arguments); if(!BD.on) return; const el = document.getElementById('hudSrc'); if(el && !el.innerHTML.includes('건축물정보')) el.innerHTML = '<b>브이월드</b> 건축물정보·연속지적 (OFFICIAL · 참고용) · ' + el.innerHTML; };
  // 카드 닫기·전체 닫기 시 하이라이트 제거

  // 주소(#on=…)에 bldg가 남아 있으면 SITE에서만 다시 켬
  if(STATE.on.has('bldg')){ if(STATE.mode==='site') on(); else STATE.on.delete('bldg'); }

  window.__BD49 = { BD, query, merge, measureHeight, vwData, vwAddr, last:null, version:'49.2' };

  function metricOf(rows, deal){ // 매매: 평당가 중앙값(만원/평) · 전세: 보증금 중앙값 · 월세: 월세 중앙값
