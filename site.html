  /* ---- 브이월드 JSONP (49 재사용, 없으면 자체) ---- */
  function jsonp(url, ms){
    return new Promise((res, rej) => {
      const cb = '__vw50_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const s = document.createElement('script'); let done = false;
      const fin = () => { done = true; clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb] = undefined; } s.remove(); };
      const t = setTimeout(()=>{ if(!done){ fin(); window[cb] = ()=>{}; rej(new Error('응답 시간 초과')); } }, ms||12000);
      window[cb] = d => { if(done) return; fin(); res(d); };
      s.onerror = () => { if(done) return; fin(); rej(new Error('네트워크 오류')); };
      s.src = url + (url.includes('?')?'&':'?') + 'callback=' + cb;
      document.head.appendChild(s);
    });
  }
  function cached(key, fn){ if(RE.cache.has(key)) return RE.cache.get(key); const p = fn(); RE.cache.set(key, p); p.catch(()=>RE.cache.delete(key)); return p; }
  const NED = 'https://api.vworld.kr/ned/data/';
  async function nedRows(op, root, params){ const d = await jsonp(NED+op+'?key='+VW_KEY+'&domain='+encodeURIComponent(VW_DOMAIN)+'&format=json&'+params); const r = d && d[root]; if(!r) return { rows:[], total:0 }; return { rows: r.field || [], total: +r.totalCount || 0 }; }
  // 공동주택가격: PNU 전체 호(최대 2,000호) · 최신 기준연도 자동 (올해 → 작년)
  function aptPrice(pnu){
    return cached('apt:'+pnu, async () => {
      const y0 = new Date().getFullYear();
      for(const y of [y0, y0-1]){
        const a = await nedRows('getApartHousingPriceAttr', 'apartHousingPrices', 'pnu='+pnu+'&stdrYear='+y+'&numOfRows=1000&pageNo=1');
        if(a.total > 0){ let rows = a.rows; for(let pg = 2; pg <= 3 && rows.length < a.total; pg++){ const b = await nedRows('getApartHousingPriceAttr', 'apartHousingPrices', 'pnu='+pnu+'&stdrYear='+y+'&numOfRows=1000&pageNo='+pg); if(!b.rows.length) break; rows = rows.concat(b.rows); }
          return { year:y, units: rows.map(r => ({ area:+r.prvuseAr, price:(+r.pblntfPc)/10000, dong:r.dongNm, ho:r.hoNm, name:r.aphusNm, kind:r.aphusSeCodeNm||'' })).filter(u => u.price > 0), total:a.total }; }
      }
      return { year:null, units:[], total:0 };
    });
  }
  function landPrice(pnu){
    return cached('land:'+pnu, async () => {
      const a = await nedRows('getIndvdLandPriceAttr', 'indvdLandPrices', 'pnu='+pnu+'&numOfRows=30&pageNo=1');
      const rows = a.rows.map(r => ({ year:+r.stdrYear, won:+r.pblntfPclnd })).filter(r=>r.won>0).sort((x,y)=>y.year-x.year);
      return rows[0] || null;
    });
  }
  function aptMedian(ap, area, ty){ // 유형(아파트/연립·다세대) 일치 호 중 면적 ±3㎡ 공시가격 중앙값(만원) → 없으면 그 유형 전체
    if(!ap || !ap.units.length) return null;
    let base = ap.units; if(ty==='A') base = base.filter(x => /아파트/.test(x.kind)); else if(ty==='B') base = base.filter(x => /연립|다세대/.test(x.kind)); if(!base.length) base = ap.units;
    let u = area ? base.filter(x => Math.abs(x.area - area) <= 3) : [];

  /* ---- 통계 ---- */
  function typesOf(s){ const cnt = {}; for(const t of s.trades) if(live(t)) cnt[t[1]] = (cnt[t[1]]||0)+1; return Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a]); }
  function stats(s, ty){ // 카드용(필터 무관 · 전체 기간 · 해제 제외 · 유형별)
    if(!ty) ty = typesOf(s)[0];
    const T = s.trades.filter(t => live(t) && t[1]===ty);
    const m = T.filter(t=>t[2]==='m'), j = T.filter(t=>t[2]==='j'), w = T.filter(t=>t[2]==='w');
    const areas = {}; for(const t of T){ const k = Math.round(t[4]); areas[k] = (areas[k]||0)+1; }
    const mainArea = Object.keys(areas).sort((a,b)=>areas[b]-areas[a]).map(Number)[0] || null;
    const bands = []; // 면적대별 (±3㎡) 매매·전세 중앙값 → 전세가율
    const keys = Object.keys(areas).map(Number).sort((a,b)=>areas[b]-areas[a]).slice(0, 6);
    const used = [];
    for(const k of keys){ if(used.some(u=>Math.abs(u-k)<=3)) continue; used.push(k);
      const mm = med(m.filter(t=>Math.abs(t[4]-k)<=3).map(t=>t[5])), jj = med(j.filter(t=>Math.abs(t[4]-k)<=3).map(t=>t[5]));
      const nm = m.filter(t=>Math.abs(t[4]-k)<=3).length, nj = j.filter(t=>Math.abs(t[4]-k)<=3).length;
      if(nm || nj) bands.push({ area:k, m:mm, j:jj, nm, nj, ratio: (mm && jj) ? jj/mm : null }); }
    bands.sort((a,b)=>a.area-b.area);
    return { n:T.length, nCancel: s.trades.filter(t=>t[1]===ty && !live(t)).length,
      m:{ n:m.length, med: med(m.map(t=>t[5])), m2: med(m.map(t=>t[5]/t[4])), py: med(m.map(t=>t[5]/(t[4]/PY))) },
      j:{ n:j.length, med: med(j.map(t=>t[5])), m2: med(j.map(t=>t[5]/t[4])) },
      w:{ n:w.length, dep: med(w.map(t=>t[5])), rent: med(w.map(t=>t[6])) },
      mainArea, bands, ty, types: typesOf(s) };
  }
  function spark(m){ // 월별 매매 평당가 중앙값 스파크라인
    const by = {}; for(const t of m){ const k = Math.floor(t[3]/100); (by[k] = by[k]||[]).push(t[5]/(t[4]/PY)); }
    const ks = Object.keys(by).map(Number).sort((a,b)=>a-b); if(ks.length < 2) return '';
    const vs = ks.map(k=>med(by[k])); const lo = Math.min(...vs), hi = Math.max(...vs); const W = 300, H = 46;
    const pts = ks.map((k,i) => [ (i/(ks.length-1))*(W-8)+4, H-6 - (hi>lo ? (vs[i]-lo)/(hi-lo) : .5)*(H-14) ]);
    const path = pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    const lab = (k) => String(k).slice(2,4)+'.'+String(k).slice(4,6);
    return `<svg viewBox="0 0 ${W} ${H+14}" width="100%" height="60" style="display:block"><path d="${path}" fill="none" stroke="#A4C81C" stroke-width="2"/>${pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2" fill="#DFFF4F"/>`).join('')}
      <text x="4" y="${H+11}" font-size="9" fill="#8AA4C4">${lab(ks[0])}</text><text x="${W-4}" y="${H+11}" font-size="9" fill="#8AA4C4" text-anchor="end">${lab(ks[ks.length-1])}</text>
      <text x="${W-4}" y="10" font-size="9" fill="#8AA4C4" text-anchor="end">최고 ${Math.round(hi).toLocaleString()}만/평</text><text x="4" y="10" font-size="9" fill="#8AA4C4">최저 ${Math.round(lo).toLocaleString()}만/평</text></svg>`;
  }

      <li>☐ 잔금 당일 전입신고 + 확정일자 (<a href="https://www.gov.kr/" target="_blank" rel="noopener">정부24</a>·주민센터) · 계약서에 "잔금 다음날까지 근저당 설정 금지" 특약</li>
      <li>☐ 전세보증금 반환보증 가입 — <a href="https://www.khug.or.kr/" target="_blank" rel="noopener">HUG</a> · <a href="https://www.hf.go.kr/" target="_blank" rel="noopener">HF</a> · <a href="https://www.sgic.co.kr/" target="_blank" rel="noopener">SGI</a></li>
      <li>☐ 건축물대장 용도가 주거용(주택·아파트·오피스텔 주거)인지 · 위반건축물 표기 없는지 — <a href="https://www.eais.go.kr/" target="_blank" rel="noopener">세움터</a></li>
      </ul></div>
      <div class="sec"><div class="meta">국토교통부 실거래가·브이월드 공시가격 기반 추정 · 참고용, 법적 효력 없음</div></div>`;
    out.innerHTML = html;
    JS.last = { sid: s[0], html, est, ratio, comb, hp, limit, pass, margin, gong, area, dep, sen, type, name:s[1], addr:s[2]+' '+s[3] };
    const cp = document.getElementById('js51copy'); if(cp) cp.disabled = false;
    window.__JS51.last = JS.last;
  }
  function text(){
    const L = JS.last; if(!L) return '';
    const lines = ['[전세 안전 체크] '+L.name+' ('+L.addr+') · '+TYN[L.type]+' '+L.area+'㎡',
      '보증금 '+won(L.dep)+(L.sen?' · 선순위 '+won(L.sen):''),
      L.est ? '① 전세가율 '+Math.round(L.ratio*100)+'% ('+light(L.ratio).txt+') · 추정 매매가 '+won(L.est.price)+' · 근거: '+L.est.basis+' n='+L.est.n+(L.sen?' · (보증금+선순위)/추정가 '+Math.round(L.comb*100)+'%':'') : '① 전세가율: 추정 매매가 산정 불가',
      '   공시가격: '+(L.gong && L.gong.price ? won(L.gong.price)+' ('+L.gong.label+')' : (L.gong?L.gong.label:'-')),
      L.limit!=null ? '② HUG 반환보증(추정): '+(L.pass?'가입 가능 범위':'한도 초과')+' · 주택가격 '+won(L.hp)+' · 한도(90%) '+won(L.limit)+' · 여유 '+(L.margin>=0?'+':'-')+won(Math.abs(L.margin)) : '② HUG 반환보증: 판정 불가',
      '   ※ 2025.10 기준 HUG 산정기준을 단순화한 추정. 실제 심사와 다를 수 있음 (HUG/HF/SGI 확인)',
      '③ 위반건축물: 자동 확인 불가 → 세움터(eais.go.kr)/정부24 건축물대장에서 확인',
      '④ 체크리스트: 등기부등본(갑구 소유자·을구 근저당·압류) / 임대인 국세·지방세 체납 열람 / 전입신고·확정일자 / 보증보험 가입 / 건축물대장 용도(주거용)',
      '출처: 국토교통부 실거래가(2025.10~2026.09)·브이월드 공시가격 · 참고용, 법적 효력 없음 · SISTECH EARTH'];
    return lines.join('\n');
  }
  async function copy(){ const t = text(); if(!t) return; try{ await navigator.clipboard.writeText(t); toast('결과 텍스트를 복사했습니다', 1800); }catch(e){ const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('결과 텍스트를 복사했습니다', 1800); }catch(err){ toast('복사 실패 · 수동으로 선택하세요', 2000); } ta.remove(); } }
  function select(sid){ JS.sid = sid; JS.picking = false; JS.last = null; form(); const s = R().site(sid); if(s) R().flyToSite(s, false); }

  /* ---- 켜기/끄기 ---- */
  async function on(){
    if(!STATE.on.has('re')){ await toggleLayer('re', true); if(!STATE.on.has('re')) return; }
    if(JS.sid==null && R().RE.sel!=null) JS.sid = R().RE.sel;
    JS.picking = JS.sid==null; form();
    if(JS.sid==null) toast('지도에서 단지 기둥을 클릭하면 전세 안전 체크가 시작됩니다', 2600);
  }
  function off(){ JS.open = false; JS.picking = false; if(document.getElementById('js51body')){ document.getElementById('card').classList.remove('open'); const R0 = R(); if(R0) R0.setCardOpen(false); } }
  const _t51 = toggleLayer;
  toggleLayer = async function(id, force){
    if(id === 'jeonse'){
      const want = force!==undefined ? force : !STATE.on.has('jeonse');
      if(want && STATE.mode!=='site'){ toast('전세 안전 체크는 SITE 모드에서 사용합니다', 2000); return; }
      if(want){ STATE.on.add('jeonse'); try{ renderCats(); renderSub(); }catch(e){} await on(); if(!STATE.on.has('re')){ STATE.on.delete('jeonse'); } }
      else { STATE.on.delete('jeonse'); off(); }
      try{ renderCats(); renderSub(); updateSrc(); }catch(e){}
      return;
    }
    const r = await _t51.apply(this, arguments);
    if(JS.open && !STATE.on.has('jeonse')) off();
    if(STATE.on.has('jeonse') && !STATE.on.has('re')){ STATE.on.delete('jeonse'); off(); try{ renderCats(); renderSub(); }catch(e){} }
    return r;
  };
  const cc = document.getElementById('cardClose'); if(cc) cc.addEventListener('click', ()=>{ if(JS.open){ JS.open = false; JS.picking = false; } });
  try{ new MutationObserver(()=>{ if(JS.open && !document.getElementById('js51body')){ JS.open = false; JS.picking = false; } }).observe(document.getElementById('cardBody'), { childList:true }); }catch(e){}
  if(STATE.on.has('jeonse')) STATE.on.delete('jeonse'); // 패널은 주소로 복원하지 않음
  window.__JS51 = { JS, get open(){ return JS.open; }, get picking(){ return JS.picking; }, select, run, estimate, gongsiFor, light, text, form, last:null, version:'51.2' };
})();
</script>
<script>
/* ---------- 주소 해시의 켜진 레이어 복원 (cad*·re 등) · 설정 초기 반영 ---------- */
(function(){
  const want = (STATE._restore||[]).filter(id => id!=='tiles' && id!=='jeonse' && id!=='view' && MENUS.site.some(c=>c.items.some(i=>i.id===id)));
  setTimeout(async () => { for(const id of want){ if(!STATE.on.has(id)) { try{ await toggleLayer(id, true); }catch(e){} } } renderLayers(); }, 1200);
  renderLayers(); renderChips();
  // 모바일: 레이어 항목을 누르면 패널을 닫아 지도가 보이게
  if(window.matchMedia('(max-width:600px)').matches){ $('#layers').addEventListener('click', e => { if(e.target.closest('.li') || e.target.closest('[data-fly]')) setTimeout(() => $('#lpanel').classList.remove('open'), 150); }); }
  console.log('SISTECH SITE ready');
})();
</script>
